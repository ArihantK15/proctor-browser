services:
  api:
    # Local dev: build from Dockerfile.  In CI deploy the `image:` line
    # takes precedence (GHCR tag pushed by the deploy workflow).
    build: .
    # image: ghcr.io/${GITHUB_REPOSITORY:-user/repo}-api:main
    container_name: proctor-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - LOADTEST_SECRET=${LOADTEST_SECRET:-}
      - GIT_SHA=${GIT_SHA:-local}
      - IMAGE_TAG=${IMAGE_TAG:-local}
      - APP_VERSION=${APP_VERSION:-dev}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - UVICORN_LIMIT_CONCURRENCY=${UVICORN_LIMIT_CONCURRENCY:-}
    depends_on:
      - redis
    volumes:
      - ./screenshots:/app/screenshots
      - ./logs:/data/logs
    deploy:
      resources:
        limits:
          memory: 1200m       # 2 sync workers; ~500-600 MB each under load
          cpus: "0.7"         # droplet has 1 CPU total; leave headroom for Caddy + Redis
    memswap_limit: 1200m      # equal to memory = no swap allowed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: proctor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./app/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    memswap_limit: 384m
    depends_on:
      # Wait for the API healthcheck to pass before Caddy starts —
      # otherwise the proxy boots first and serves 502 to anyone
      # hitting the site during the ~15 s API warm-up after deploy.
      api:
        condition: service_healthy
  worker:
    build: .
    entrypoint: python worker.py
    container_name: proctor-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - RQ_ENABLED=1
      - GIT_SHA=${GIT_SHA:-local}
      - IMAGE_TAG=${IMAGE_TAG:-local}
      - APP_VERSION=${APP_VERSION:-dev}
    depends_on:
      - redis
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    memswap_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  autosave-worker:
    build: .
    entrypoint: python worker.py
    container_name: proctor-autosave-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - RQ_ENABLED=1
      - RQ_QUEUE=autosave
      - GIT_SHA=${GIT_SHA:-local}
      - IMAGE_TAG=${IMAGE_TAG:-local}
      - APP_VERSION=${APP_VERSION:-dev}
    depends_on:
      - redis
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    memswap_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  redis:
    image: redis:7-alpine
    container_name: proctor-redis
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 96m
          cpus: "0.2"
    memswap_limit: 96m
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:16-alpine
    container_name: proctor-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-procta}
      - POSTGRES_USER=${POSTGRES_USER:-procta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required when starting postgres profile}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # ofelia (the scheduler service below) reads these labels to know
    # when to run a job inside this container. @daily = 00:00 UTC =
    # 05:30 IST, before normal customer traffic. The job runs pg_dump
    # to /backups (host-mounted) with custom-format compression, then
    # prunes anything older than 14 days. Matches scripts/backup_postgres.sh
    # so the manual + scheduled flows produce identical artefacts.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.daily-backup.schedule: "@daily"
      ofelia.job-exec.daily-backup.command: >
        sh -c 'pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
        --format=custom --no-owner --no-privileges
        > /backups/procta-$$(date -u +%Y%m%dT%H%M%SZ).dump
        && find /backups -name "procta-*.dump" -type f -mtime +14 -delete'

  ofelia:
    # Lightweight cron-for-docker (~3 MB image). Reads schedule from the
    # `ofelia.*` labels on the postgres service and exec's the configured
    # command inside that container — no extra cron daemon to maintain
    # on the host. Read-only docker.sock mount is the standard ofelia
    # pattern; the daemon only needs `exec` capability into other
    # containers, never `run` or `delete`.
    image: mcuadros/ofelia:latest
    container_name: proctor-ofelia
    profiles: ["postgres"]
    restart: unless-stopped
    depends_on:
      - postgres
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
