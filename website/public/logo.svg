<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none" role="img" aria-label="Procta">
  <!--
    Canonical Procta logo. Stays visually identical to the inline SVG marks
    used across the codebase (Navbar, Footer, Signup, dashboard.html,
    student.html, register.html, download.html, App.jsx, OnboardingWizard).

    The mark is a 16x16 "shield with eye dot" on a rounded accent-blue
    chip; the wordmark "Procta" sits to its right. When a designer
    provides a replacement, update THIS file AND the inline SVG paths
    so they stay in lockstep.
  -->

  <!-- Accent chip — matches `bg-accent accent-glow` Tailwind utility -->
  <rect x="4" y="12" width="32" height="32" rx="8" fill="#2563eb"/>

  <!-- 16x16 shield mark scaled into the chip -->
  <g transform="translate(8 16) scale(1.5)">
    <path d="M4 2 H12 Q13.5 2 13.5 3.5 V8 Q13.5 12 8 14 Q2.5 12 2.5 8 V3.5 Q2.5 2 4 2 Z"
          fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="8" cy="8" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Wordmark — IBM Plex Sans, matches the in-app brand typography -->
  <text x="48" y="38"
        font-family="'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="-0.02em"
        fill="#0f172a">Procta</text>
</svg>
