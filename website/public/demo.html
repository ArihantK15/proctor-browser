<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>

#root { width: 100%; height: 100%; }

<!-- ── Inline replacements for the external animations.jsx + tweaks-panel.jsx
     scripts. The original file expected a Stage/useTime helper bundle from
     whatever tool generated it; for the marketing embed we only need a
     looping time source, an aspect-ratio scaler, and no-op tweaks. ── -->
<script type="text/babel">
const { useState: _useState, useEffect: _useEffect, useRef: _useRef, useLayoutEffect: _useLayoutEffect } = React;

window.__procta_clock = { speed: 1, duration: 98 };
function useTime() {
  const [t, setT] = _useState(0);
  _useEffect(() => {
    let raf, start = performance.now();
    const tick = (now) => {
      const { speed, duration } = window.__procta_clock;
      const elapsed = ((now - start) / 1000) * speed;
      setT(elapsed % duration); // seamless loop for the marketing embed
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return t;
}

// Stage — fixed 1920×1080 canvas, strict contain-scale (no boost).
// We tried scale-boosting earlier to fight the perceived "small"
// look from the demo's intentional negative space, but the
// callouts use stage-space coordinates that humans perceive
// relative to the visible frame — cropping the edges visually
// displaced labels from their targets. Keep contain-scale and
// give the embed more real estate via the marketing card width
// instead.
function Stage({ width, height, duration, background, speed = 1, children }) {
  const wrapRef = _useRef(null);
  const [scale, setScale] = _useState(1);
  _useLayoutEffect(() => {
    window.__procta_clock.duration = duration;
    window.__procta_clock.speed = speed;
  }, [duration, speed]);
  _useLayoutEffect(() => {
    const recompute = () => {
      if (!wrapRef.current) return;
      const w = wrapRef.current.clientWidth;
      const h = wrapRef.current.clientHeight;
      if (w > 0 && h > 0) {
        setScale(Math.min(w / width, h / height));
      }
    };
    recompute();
    const ro = new ResizeObserver(recompute);
    if (wrapRef.current) ro.observe(wrapRef.current);
    window.addEventListener('resize', recompute);
    return () => { ro.disconnect(); window.removeEventListener('resize', recompute); };
  }, [width, height]);
  return (
    <div ref={wrapRef} style={{
      position: 'absolute', inset: 0, background,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      overflow: 'hidden',
    }}>
      <div style={{
        width, height, position: 'relative',
        transform: `scale(${scale})`, transformOrigin: 'center center',
      }}>{children}</div>
    </div>
  );
}

// Tweaks panel + hooks — stubbed for production.
function useTweaks(defaults) { return [defaults, () => {}]; }
function TweaksPanel()   { return null; }
function TweakSection()  { return null; }
function TweakToggle()   { return null; }
function TweakSlider()   { return null; }
</script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Duration & scene boundaries ────────────────────────────────────────────
// S0:  0– 6   Intro title card
// S1:  6–18   Calibration
// S2: 18–34   Student exam window
// S3: 34–48   AI violation detection
// S4: 48–66   Teacher live dashboard
// S5: 66–84   Post-exam analytics
// S6: 84–98   Outro / CTA
const DURATION = 98;

// ── Math helpers ──────────────────────────────────────────────────────────
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t)   => a + (b - a) * t;
const easeOut    = t => 1 - Math.pow(1 - t, 3);
const easeIn     = t => t * t * t;
const easeInOut  = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOutBack= t => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };

const prog    = (t, s, e)       => clamp((t-s)/(e-s), 0, 1);
const fadeIn  = (t, s, dur=0.4) => easeOut(prog(t, s, s+dur));
const fadeOut = (t, e, dur=0.3) => 1 - easeIn(prog(t, e-dur, e));
const appear  = (t, s, inD=0.4, outT=null, outD=0.3) => {
  const i = fadeIn(t, s, inD);
  if (outT !== null) return i * (1 - easeIn(prog(t, outT - outD, outT)));
  return i;
};

// ── Colour palette ────────────────────────────────────────────────────────
const C = {
  accent:   'oklch(58% 0.19 260)',
  accentD:  'oklch(50% 0.18 260)',
  bgBase:   'oklch(9%  0.008 240)',
  bgInset:  'oklch(7%  0.007 240)',
  bgSubtle: 'oklch(11% 0.009 240)',
  surf1:    'oklch(13% 0.010 240)',
  surf2:    'oklch(16% 0.010 240)',
  surf3:    'oklch(20% 0.011 240)',
  hiText:   'oklch(97% 0.005 240)',
  midText:  'oklch(72% 0.014 240)',
  mutedText:'oklch(47% 0.013 240)',
  border:   'oklch(20% 0.011 240)',
  borderMed:'oklch(28% 0.011 240)',
  success:  'oklch(62% 0.16 150)',
  successBg:'oklch(18% 0.06 150)',
  warn:     'oklch(75% 0.17 85)',
  warnBg:   'oklch(18% 0.07 85)',
  error:    'oklch(62% 0.20 27)',
  errorBg:  'oklch(17% 0.08 27)',
  critical: 'oklch(54% 0.22 0)',
  critBg:   'oklch(15% 0.09 0)',
  info:     'oklch(65% 0.17 260)',
  infoBg:   'oklch(18% 0.07 260)',
  calib:    'oklch(70% 0.17 310)',
  calibBg:  'oklch(17% 0.07 310)',
  // light
  lBg:      'oklch(98.5% 0.005 240)',
  lBgIn:    'oklch(96%   0.008 240)',
  lSurf:    'oklch(100%  0 0)',
  lHi:      'oklch(12%   0.009 240)',
  lMid:     'oklch(38%   0.012 240)',
  lMuted:   'oklch(55%   0.013 240)',
  lBorder:  'oklch(88%   0.012 240)',
};

// ── Avatar Cam ────────────────────────────────────────────────────────────
// state: { headRot, gazeX, gazeY, secondFace, phone, faceVisible, audioSpike }
// Stylized head/shoulders + tracked eyes; renders bounding boxes when flagged.
function AvatarCam({ state, w=320, h=200, showOverlay=true, label="Priya Sharma · S-2041" }) {
  const cx = w/2, cy = h*0.48;
  const headW = w*0.30, headH = h*0.62;
  const headRot = state.headRot || 0;       // degrees
  const gazeX = state.gazeX || 0;           // -1..1
  const gazeY = state.gazeY || 0;
  const faceVisible = state.faceVisible !== false;
  const eyeOff = 6;
  // Confidence wiggle
  const conf = (state.faceConf || 0.97).toFixed(2);

  // Second-person head positioned to the right
  const sec = state.secondFace;
  const secCx = w*0.78, secCy = h*0.55, secW = w*0.20, secH = h*0.46;

  // Phone bbox (handheld, lower-right)
  const ph = state.phone;
  const phX = w*0.62, phY = h*0.66, phW = w*0.10, phH = h*0.22;

  const primaryBoxColor = !faceVisible ? '#e94e4e' :
                          (sec || ph || Math.abs(headRot) > 25 || Math.abs(gazeX) > 0.6) ? '#f0a830' :
                          '#3acf6a';

  return (
    <div style={{position:'relative',width:w,height:h,background:'linear-gradient(180deg,#1a1d24,#0f1116)',borderRadius:6,overflow:'hidden',border:'1px solid oklch(28% 0.011 240)'}}>
      {/* room backdrop hint */}
      <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at 30% 20%, oklch(20% 0.013 240) 0%, transparent 60%)'}}/>
      {/* desk line */}
      <div style={{position:'absolute',left:0,right:0,bottom:h*0.18,height:1,background:'oklch(22% 0.011 240)'}}/>

      {/* Reusable head renderer: foreshortens horizontally based on yaw, eyes shift toward turn direction */}
      <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} style={{position:'absolute',inset:0}}>
        {(() => {
          // Render primary head with proper yaw foreshortening
          const yaw = headRot; // -45..45
          const yawNorm = yaw/45; // -1..1
          const fore = 1 - Math.abs(yawNorm)*0.35; // x-scale shrinks as we turn
          const eyeShift = yawNorm * headW*0.10; // eyes/nose translate with turn
          const hw = headW*0.42, hh = headH*0.42;
          const skin = 'oklch(58% 0.06 55)';
          const skinShade = 'oklch(48% 0.06 55)';
          const hair = 'oklch(18% 0.015 40)';

          return faceVisible && (
            <>
              {/* Shoulders */}
              <path d={`M ${cx-headW*1.15} ${h+2} Q ${cx-headW*0.85} ${cy+hh*1.55}, ${cx-headW*0.55} ${cy+hh*1.45} L ${cx+headW*0.55} ${cy+hh*1.45} Q ${cx+headW*0.85} ${cy+hh*1.55}, ${cx+headW*1.15} ${h+2} Z`}
                    fill="oklch(26% 0.015 240)"/>
              {/* Neck */}
              <rect x={cx-headW*0.16+eyeShift*0.6} y={cy+hh*0.85} width={headW*0.32} height={hh*0.55} fill={skinShade} rx={3}/>
              {/* Head group: only horizontal scale, no rotation. Eyes/nose/mouth shift with yaw */}
              <g transform={`translate(${cx} ${cy}) scale(${fore} 1)`}>
                {/* Skull */}
                <ellipse cx={0} cy={0} rx={hw} ry={hh} fill={skin}/>
                {/* Cheek shadow on far side when turning */}
                {Math.abs(yawNorm)>0.1 && (
                  <ellipse cx={-yawNorm*hw*0.5} cy={hh*0.05} rx={hw*0.45} ry={hh*0.6} fill={skinShade} opacity={Math.abs(yawNorm)*0.5}/>
                )}
                {/* Hair cap — sits on top of skull */}
                <path d={`M ${-hw*0.98} ${-hh*0.05}
                          C ${-hw*0.98} ${-hh*0.95}, ${hw*0.98} ${-hh*0.95}, ${hw*0.98} ${-hh*0.05}
                          C ${hw*0.85} ${-hh*0.4}, ${-hw*0.85} ${-hh*0.4}, ${-hw*0.98} ${-hh*0.05} Z`}
                      fill={hair}/>
                {/* Forehead fringe */}
                <path d={`M ${-hw*0.6} ${-hh*0.55} Q ${-hw*0.2} ${-hh*0.3}, ${hw*0.1} ${-hh*0.45} Q ${hw*0.5} ${-hh*0.55}, ${hw*0.7} ${-hh*0.4} L ${hw*0.85} ${-hh*0.5} Q ${hw*0.4} ${-hh*0.85}, ${-hw*0.4} ${-hh*0.85} Q ${-hw*0.85} ${-hh*0.7}, ${-hw*0.6} ${-hh*0.55} Z`}
                      fill={hair}/>
                {/* Eyes (sclera) — translated by eyeShift */}
                <g transform={`translate(${eyeShift} 0)`}>
                  <ellipse cx={-hw*0.30} cy={-hh*0.05} rx={hw*0.13} ry={hh*0.09} fill="white" opacity="0.94"/>
                  <ellipse cx={ hw*0.30} cy={-hh*0.05} rx={hw*0.13} ry={hh*0.09} fill="white" opacity="0.94"/>
                  {/* pupils */}
                  <circle cx={-hw*0.30 + gazeX*5} cy={-hh*0.05 + gazeY*3} r={3} fill="oklch(20% 0.02 240)"/>
                  <circle cx={ hw*0.30 + gazeX*5} cy={-hh*0.05 + gazeY*3} r={3} fill="oklch(20% 0.02 240)"/>
                  {/* eyebrows */}
                  <path d={`M ${-hw*0.42} ${-hh*0.22} Q ${-hw*0.30} ${-hh*0.28}, ${-hw*0.18} ${-hh*0.22}`} stroke={hair} strokeWidth="2" fill="none" strokeLinecap="round"/>
                  <path d={`M ${ hw*0.18} ${-hh*0.22} Q ${ hw*0.30} ${-hh*0.28}, ${ hw*0.42} ${-hh*0.22}`} stroke={hair} strokeWidth="2" fill="none" strokeLinecap="round"/>
                  {/* nose */}
                  <path d={`M 0 ${-hh*0.02} Q ${2} ${hh*0.18}, ${4} ${hh*0.22}`} stroke={skinShade} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
                  {/* mouth */}
                  <path d={`M ${-hw*0.18} ${hh*0.45} Q 0 ${hh*0.52}, ${hw*0.18} ${hh*0.45}`} stroke="oklch(32% 0.05 25)" strokeWidth="1.8" fill="none" strokeLinecap="round"/>
                </g>
              </g>
            </>
          );
        })()}

        {/* Second face — same renderer, slightly smaller, behind/right of primary */}
        {sec && (() => {
          const op = typeof sec==='number'?sec:1;
          const sw = secW*0.42, sh = secH*0.42;
          const skin2 = 'oklch(54% 0.05 55)';
          const skin2Shade = 'oklch(44% 0.05 55)';
          const hair2 = 'oklch(15% 0.012 40)';
          return (
            <g opacity={op}>
              {/* shoulders */}
              <path d={`M ${secCx-secW*0.95} ${h+2} Q ${secCx-secW*0.7} ${secCy+sh*1.55}, ${secCx-secW*0.5} ${secCy+sh*1.45} L ${secCx+secW*0.5} ${secCy+sh*1.45} Q ${secCx+secW*0.7} ${secCy+sh*1.55}, ${secCx+secW*0.95} ${h+2} Z`} fill="oklch(22% 0.012 240)"/>
              {/* neck */}
              <rect x={secCx-secW*0.13} y={secCy+sh*0.85} width={secW*0.26} height={sh*0.5} fill={skin2Shade} rx={2}/>
              <g transform={`translate(${secCx} ${secCy})`}>
                <ellipse cx={0} cy={0} rx={sw} ry={sh} fill={skin2}/>
                {/* hair cap */}
                <path d={`M ${-sw*0.98} ${-sh*0.05}
                          C ${-sw*0.98} ${-sh*0.95}, ${sw*0.98} ${-sh*0.95}, ${sw*0.98} ${-sh*0.05}
                          C ${sw*0.85} ${-sh*0.4}, ${-sw*0.85} ${-sh*0.4}, ${-sw*0.98} ${-sh*0.05} Z`}
                      fill={hair2}/>
                {/* eyebrows */}
                <path d={`M ${-sw*0.4} ${-sh*0.22} Q ${-sw*0.28} ${-sh*0.28}, ${-sw*0.16} ${-sh*0.22}`} stroke={hair2} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
                <path d={`M ${ sw*0.16} ${-sh*0.22} Q ${ sw*0.28} ${-sh*0.28}, ${ sw*0.4} ${-sh*0.22}`} stroke={hair2} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
                {/* eyes */}
                <ellipse cx={-sw*0.28} cy={-sh*0.05} rx={sw*0.12} ry={sh*0.08} fill="white" opacity="0.92"/>
                <ellipse cx={ sw*0.28} cy={-sh*0.05} rx={sw*0.12} ry={sh*0.08} fill="white" opacity="0.92"/>
                <circle cx={-sw*0.30} cy={-sh*0.05} r={2} fill="oklch(20% 0.02 240)"/>
                <circle cx={ sw*0.26} cy={-sh*0.05} r={2} fill="oklch(20% 0.02 240)"/>
                {/* mouth */}
                <path d={`M ${-sw*0.16} ${sh*0.42} Q 0 ${sh*0.5}, ${sw*0.16} ${sh*0.42}`} stroke="oklch(32% 0.05 25)" strokeWidth="1.4" fill="none" strokeLinecap="round"/>
              </g>
            </g>
          );
        })()}

        {/* Phone */}
        {ph && (
          <g opacity={typeof ph==='number'?ph:1}>
            <rect x={phX} y={phY} width={phW} height={phH} rx={3} fill="oklch(15% 0.01 240)" stroke="oklch(35% 0.013 240)"/>
            <rect x={phX+2} y={phY+4} width={phW-4} height={phH-8} fill="oklch(60% 0.18 220)" opacity={0.55}/>
          </g>
        )}

        {/* Bounding boxes */}
        {showOverlay && faceVisible && (
          <g>
            <rect x={cx - headW*0.55} y={cy - headH*0.55} width={headW*1.1} height={headH*1.05}
                  fill="none" stroke={primaryBoxColor} strokeWidth="1.4" strokeDasharray="3 2"/>
            <rect x={cx - headW*0.55} y={cy - headH*0.55 - 14} width={64} height={12} fill={primaryBoxColor} opacity="0.9"/>
            <text x={cx - headW*0.55 + 4} y={cy - headH*0.55 - 4} fontFamily="IBM Plex Mono, monospace" fontSize="9" fill="black" fontWeight="600">FACE {conf}</text>
          </g>
        )}
        {showOverlay && sec && (
          <g>
            <rect x={secCx - secW*0.55} y={secCy - secH*0.55} width={secW*1.1} height={secH*1.05}
                  fill="none" stroke="#e94e4e" strokeWidth="1.4" strokeDasharray="3 2"/>
            <rect x={secCx - secW*0.55} y={secCy - secH*0.55 - 14} width={70} height={12} fill="#e94e4e"/>
            <text x={secCx - secW*0.55 + 4} y={secCy - secH*0.55 - 4} fontFamily="IBM Plex Mono, monospace" fontSize="9" fill="white" fontWeight="600">FACE 0.81</text>
          </g>
        )}
        {showOverlay && ph && (
          <g>
            <rect x={phX-2} y={phY-2} width={phW+4} height={phH+4} fill="none" stroke="#e94e4e" strokeWidth="1.4" strokeDasharray="3 2"/>
            <rect x={phX-2} y={phY-16} width={70} height={12} fill="#e94e4e"/>
            <text x={phX+2} y={phY-6} fontFamily="IBM Plex Mono, monospace" fontSize="9" fill="white" fontWeight="600">PHONE 0.84</text>
          </g>
        )}

        {/* Gaze vector */}
        {showOverlay && faceVisible && (
          (() => {
            const startX = cx, startY = cy - headH*0.04;
            const len = 60;
            const ex = startX + gazeX*len + headRot*0.4;
            const ey = startY + gazeY*len*0.7;
            const offScreen = Math.abs(gazeX) > 0.6 || Math.abs(gazeY) > 0.6;
            return (
              <g opacity={0.85}>
                <line x1={startX} y1={startY} x2={ex} y2={ey} stroke={offScreen ? '#e94e4e' : '#5a8df0'} strokeWidth="1.3" strokeDasharray="2 2"/>
                <circle cx={ex} cy={ey} r={3} fill={offScreen ? '#e94e4e' : '#5a8df0'}/>
              </g>
            );
          })()
        )}

        {/* "Face not visible" */}
        {!faceVisible && (
          <g>
            <rect x={cx-60} y={cy-12} width={120} height={24} fill="oklch(15% 0.08 27)" stroke="#e94e4e"/>
            <text x={cx} y={cy+4} textAnchor="middle" fontFamily="IBM Plex Mono, monospace" fontSize="10" fill="#e94e4e" fontWeight="600">NO FACE DETECTED</text>
          </g>
        )}
      </svg>

      {/* HUD chrome */}
      <div style={{position:'absolute',top:6,left:6,display:'flex',alignItems:'center',gap:5,fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:'rgba(255,255,255,0.85)'}}>
        <div style={{width:6,height:6,borderRadius:'50%',background:'#e94e4e',animation:'pulse 1.4s infinite'}}/>
        REC · 720p
      </div>
      <div style={{position:'absolute',top:6,right:8,fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:'rgba(255,255,255,0.7)'}}>{label}</div>
      {state.audioSpike && (
        <div style={{position:'absolute',bottom:6,right:8,display:'flex',alignItems:'flex-end',gap:1.5,height:14}}>
          {[0.3,0.7,1,0.5,0.85,0.4,0.6].map((v,i)=>(
            <div key={i} style={{width:2,height:`${v*100}%`,background:'#f0a830'}}/>
          ))}
        </div>
      )}
      {/* Corner crosshairs */}
      <svg style={{position:'absolute',inset:0,pointerEvents:'none'}} width={w} height={h}>
        {[[8,8],[w-8,8],[8,h-8],[w-8,h-8]].map(([x,y],i)=>(
          <g key={i} stroke="rgba(255,255,255,0.25)" strokeWidth="1" fill="none">
            <line x1={x-4} y1={y} x2={x+4} y2={y}/>
            <line x1={x} y1={y-4} x2={x} y2={y+4}/>
          </g>
        ))}
      </svg>
    </div>
  );
}

// ── Logo SVG ──────────────────────────────────────────────────────────────
function PrLogo({ size=22, color=C.accent }) {
  return (
    <svg viewBox="0 0 44 32" width={size} height={size*32/44} fill="none" style={{flexShrink:0,verticalAlign:'middle'}}>
      <path d="M2 16 C8 4 36 4 42 16 C36 28 8 28 2 16 Z" stroke={color} strokeWidth="1.6" strokeOpacity="0.55" fill="none"/>
      <circle cx="22" cy="16" r="8"   stroke={color} strokeWidth="1.3" strokeOpacity="0.6" fill="none"/>
      <circle cx="22" cy="16" r="3.5" fill={color}/>
      <circle cx="25" cy="13" r="1.2" fill="white" fillOpacity="0.55"/>
    </svg>
  );
}

// ── Callout label with connector line ────────────────────────────────────
// ax,ay = anchor point (tip of line, on the UI element)
// lx,ly = label position
// accent = blue style; default = amber
function Callout({ children, ax, ay, lx, ly, opacity=1, accent=false }) {
  if (opacity < 0.01) return null;
  const col = accent ? C.accent : C.warn;
  const bgCol = accent ? 'oklch(10% 0.06 260/0.93)' : 'oklch(10% 0.05 85/0.93)';

  // Determine label anchor side: if label is to the right of anchor, attach line to left of label
  const labelOnRight = lx > ax;

  return (
    <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:200,opacity}}>
      {/* SVG connector line — drawn after label so we know label mid-y */}

// ── Wipe transition overlay ───────────────────────────────────────────────
// Dark→light boundary wipes use a neutral mid-tone and longer duration to
// avoid harsh black flash between scenes 3↔4 and 4↔5↔6.
function SceneWipe({ t, at, dur=0.45, color='oklch(6% 0.007 240)' }) {
  const p = clamp((t-at)/dur, 0, 1);
  if (p<=0 || p>=1) return null;
  const alpha = p < 0.5 ? p*2 : (1-p)*2;
  return (
    <div style={{position:'absolute',inset:0,pointerEvents:'none',zIndex:300,
      background:color, opacity: alpha}}/>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// SCENE 1 — Calibration (6–18s)
// ─────────────────────────────────────────────────────────────────────────
function Scene1({ t, showCallouts }) {
  const localT  = t - 6;
  const visible = fadeIn(t,6,0.5) * (t>17?fadeOut(t,18,0.5):1);

  const dots = [
    {x:0.12,y:0.18},{x:0.50,y:0.12},{x:0.88,y:0.18},
    {x:0.12,y:0.50},{x:0.50,y:0.50},{x:0.88,y:0.50},
    {x:0.12,y:0.82},{x:0.50,y:0.88},{x:0.88,y:0.82},
  ];
  const dotDur=1.1, dotStart=1.2;
  const floatDot  = Math.min(8, Math.max(0, Math.floor((localT-dotStart)/dotDur)));
  const dotProg   = clamp((localT-dotStart-floatDot*dotDur)/dotDur,0,1);
  const completed = Math.max(-1, floatDot-1);
  const pct       = clamp(localT>dotStart?(floatDot+dotProg)/9:0,0,1);
  const isDone    = pct>=0.999;

  const c1Op = showCallouts ? fadeIn(t,7.5,0.4)*(t>17?fadeOut(t,17,0.5):1) : 0;
  const c2Op = showCallouts ? fadeIn(t,10,0.4)*(t>17?fadeOut(t,17,0.5):1) : 0;

  const W=1520, H=800;

  return (
    <div style={{position:'relative',width:'100%',background:C.bgBase,opacity:visible,overflow:'hidden',fontFamily:"'IBM Plex Sans',sans-serif",borderRadius:10}}>
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',opacity:0.3}}>
        <defs><pattern id="cgrid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="oklch(20% 0.011 240)" strokeWidth="1"/></pattern></defs>
        <rect width="100%" height="100%" fill="url(#cgrid)"/>
      </svg>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'0 20px',height:50,background:C.bgInset,borderBottom:`1px solid ${C.border}`,position:'relative',zIndex:10}}>
        <PrLogo size={16} color={C.accent}/>
        <span style={{fontSize:12,fontWeight:700,letterSpacing:'-0.02em',color:C.midText}}>procta</span>
        <div style={{width:1,height:18,background:C.border}}/>
        <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mutedText}}>CS301 — Database Systems · Gaze Calibration</span>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:110,height:3,background:C.surf2,borderRadius:99,overflow:'hidden'}}>
            <div style={{height:'100%',background:C.accent,borderRadius:99,width:`${pct*100}%`}}/>
          </div>
          <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mutedText}}>{Math.round(pct*9)}/9</span>
        </div>
      </div>
      {/* Stage */}
      <div style={{position:'relative',height:480}}>
        {dots.map((d,i)=>{
          const isCur  = i===floatDot && localT>dotStart;
          const isComp = i<=completed;
          if(!isCur&&!isComp) return null;
          const cx=d.x*W, cy=d.y*H*0.6;
          return (
            <div key={i} style={{position:'absolute',left:cx,top:cy,transform:'translate(-50%,-50%)',opacity:isComp?0.5:1}}>
              {isCur&&(
                <>
                  <div style={{position:'absolute',width:64,height:64,left:'50%',top:'50%',transform:'translate(-50%,-50%)',borderRadius:'50%',border:`1.5px solid ${C.accent}`,opacity:0.15}}/>
                  <div style={{position:'absolute',width:44,height:44,left:'50%',top:'50%',transform:'translate(-50%,-50%)',borderRadius:'50%',border:`1.5px solid ${C.accent}`,opacity:0.3}}/>
                  <div style={{position:'absolute',width:64,height:64,left:'50%',top:'50%',transform:'translate(-50%,-50%)',borderRadius:'50%',background:`conic-gradient(${C.accent} ${dotProg*360}deg, transparent 0deg)`,opacity:0.55,WebkitMask:'radial-gradient(farthest-side,transparent calc(100% - 3px),black calc(100% - 3px))',mask:'radial-gradient(farthest-side,transparent calc(100% - 3px),black calc(100% - 3px))'}}/>
                </>
              )}
              <div style={{width:13,height:13,borderRadius:'50%',background:isComp?C.success:C.accent,boxShadow:`0 0 0 3px oklch(from ${isComp?C.success:C.accent} l c h / 0.2)`,position:'relative',zIndex:2}}/>
            </div>
          );
        })}
        {/* Instruction */}
        <div style={{position:'absolute',bottom:24,left:'50%',transform:'translateX(-50%)'}}>
          <div style={{background:C.surf1,border:`1px solid ${C.border}`,borderRadius:10,padding:'12px 24px',textAlign:'center',minWidth:320}}>
            {isDone?(
              <div style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}>
                <div style={{width:7,height:7,borderRadius:'50%',background:C.success}}/>
                <span style={{fontSize:13,fontWeight:600,color:C.success}}>Calibration complete — 9/9 points captured</span>
              </div>
            ):(
              <>
                <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:C.mutedText,marginBottom:3,letterSpacing:'0.06em',textTransform:'uppercase'}}>Look directly at the dot</div>
                <div style={{fontSize:12,color:C.midText}}>Hold your gaze for <span style={{color:C.hiText,fontWeight:600}}>3 seconds</span> until it turns green</div>
              </>
            )}
          </div>
        </div>
      </div>
      {/* Avatar PiP — eyes track the active calibration dot */}
      {(() => {
        const cur = dots[Math.min(8, Math.max(0, floatDot))];
        // Map dot position (0..1) to gaze (-1..1) with slight ease
        const tgtX = (cur.x - 0.5) * 1.6;
        const tgtY = (cur.y - 0.5) * 1.0;
        // Smooth approach as the user "settles" gaze on the dot
        const settle = clamp((dotProg - 0.1)/0.6, 0, 1);
        const avState = {
          headRot: tgtX * 6 * settle,
          gazeX: tgtX * settle + (1-settle) * Math.sin(localT*2)*0.05,
          gazeY: tgtY * settle * 0.8,
          secondFace: false, phone: false, faceVisible: true, audioSpike: false, faceConf: 0.97,
        };
        return (
          <div style={{position:'absolute',right:18,bottom:80,width:188,opacity:visible*0.95,zIndex:5}}>
            <div style={{background:'#000',borderRadius:8,overflow:'hidden',border:`1px solid ${C.border}`,boxShadow:'0 8px 24px rgba(0,0,0,0.4)'}}>
              <AvatarCam state={avState} w={188} h={118} showOverlay={true} label="You · calibrating"/>
            </div>
            <div style={{marginTop:6,display:'flex',alignItems:'center',gap:6,fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:C.mutedText,letterSpacing:'0.06em',textTransform:'uppercase'}}>
              <div style={{width:5,height:5,borderRadius:'50%',background:settle>0.7?C.success:C.accent,boxShadow:`0 0 6px ${settle>0.7?C.success:C.accent}`}}/>
              {settle>0.7 ? 'Locked' : 'Tracking eyes'}
            </div>
          </div>
        );
      })()}
      <SceneLabel title="Gaze Calibration" sub="01 · Student Setup" opacity={visible}/>
    </div>
  );
}

                    );

                <button style={{padding:'5px 12px',borderRadius:5,border:`1px solid ${border}`,background:isDark?C.surf1:'white',color:mid,fontSize:11,cursor:'pointer',fontFamily:"'IBM Plex Sans',sans-serif"}}>Flag</button>
                <button style={{marginLeft:'auto',padding:'5px 14px',borderRadius:5,background:C.accent,color:'white',border:'none',fontSize:11,cursor:'pointer',fontWeight:500,fontFamily:"'IBM Plex Sans',sans-serif"}}>Next →</button>

          {/* Chat drawer */}
          {chatOpen&&(
            <div style={{position:'absolute',bottom:0,right:0,width:270,height:310,background:surf1,border:`1px solid ${border}`,borderRadius:'8px 8px 0 0',boxShadow:'0 -8px 32px oklch(0% 0 0/0.3)',display:'flex',flexDirection:'column',overflow:'hidden',zIndex:20,opacity:fadeIn(t,29,0.4)}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',borderBottom:`1px solid ${border}`,background:bgIn}}>
                <span style={{fontSize:12,fontWeight:600,color:hi}}>Invigilator Chat</span>
                <div style={{fontSize:10,color:C.success,display:'flex',alignItems:'center',gap:4}}><div style={{width:4,height:4,borderRadius:'50%',background:C.success}}/>Online</div>

      {(() => {

        if (op < 0.01) return null;
        return (
          <div style={{position:'absolute',top:90,right:36,opacity:op,transform:`translateY(${(1-op)*-12}px)`,zIndex:20}}>

        );
      })()}
      <SceneLabel title="Student Exam Window" sub="02 · Student Experience" opacity={visible}/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// SCENE 3 — AI Violation Detection (34–48s)
// ─────────────────────────────────────────────────────────────────────────
function Scene3({ t }) {
  const localT  = t - 34;
  const visible = fadeIn(t,34,0.5) * (t>47?fadeOut(t,48,0.5):1);

  const VIOLS = [
    {time:1.0, sev:'WARN',     text:'Gaze deviation >8 seconds',      sub:'Eyes moved off-screen', icon:'eye-off'},
    {time:3.2, sev:'ERROR',    text:'Tab switch attempt detected',     sub:'Browser focus lost 1.2s', icon:'layout'},
    {time:5.5, sev:'WARN',     text:'Head pose: extreme right',        sub:'Rotation >35° detected', icon:'user'},
    {time:8.0, sev:'CRITICAL', text:'Multiple faces detected',         sub:'2 faces visible in frame', icon:'users'},
    {time:10.5,sev:'INFO',     text:'Audio spike detected',            sub:'Volume threshold exceeded', icon:'volume-2'},
    {time:12.5,sev:'ERROR',    text:'Phone detected in frame',         sub:'Rectangular object visible', icon:'smartphone'},
  ];

  // ── Avatar state sequenced to violation timeline ───────────────────────
  // Each violation has a "cause" period where the avatar visibly does the thing,
  // followed by a brief "settle" period back to neutral.
  const avatar = (() => {
    const s = { headRot:0, gazeX:0, gazeY:0, secondFace:false, phone:false, faceVisible:true, audioSpike:false, faceConf:0.97 };
    // Idle micro-motion
    s.gazeX = Math.sin(localT*0.7)*0.08;
    s.gazeY = Math.cos(localT*0.5)*0.05;
    s.headRot = Math.sin(localT*0.4)*1.5;

    // 0.5–2.0s : gaze drift (cause for violation @ 1.0)
    if (localT >= 0.4 && localT < 2.4) {
      const p = clamp((localT-0.4)/1.0, 0, 1);
      const r = clamp((2.4-localT)/0.6, 0, 1);
      s.gazeX = lerp(0.05, 0.85, easeInOut(p)) * r + (1-r)*0.05;
      s.gazeY = 0.15 * r;
    }
    // 2.7–4.0s : tab switch — eyes flick, face dims (focus lost)
    if (localT >= 2.7 && localT < 4.2) {
      s.gazeY = -0.4;
      s.faceConf = 0.93;
    }
    // 4.8–6.5s : extreme head rotation right (violation @ 5.5)
    if (localT >= 4.8 && localT < 7.0) {
      const p = clamp((localT-4.8)/1.2, 0, 1);
      const r = clamp((7.0-localT)/0.6, 0, 1);
      s.headRot = lerp(0, 42, easeInOut(p)) * r;
      s.gazeX = 0.3 * r;
    }
    // 7.4–10.5s : second face appears (violation @ 8.0)
    if (localT >= 7.4) {
      const p = clamp((localT-7.4)/0.5, 0, 1);
      s.secondFace = p;
    }
    if (localT >= 10.8) {
      const p = clamp((localT-10.8)/0.5, 0, 1);
      s.secondFace = Math.max(0, 1-p);
      if (p >= 1) s.secondFace = false;
    }
    // 9.8–11.5s : audio spike (violation @ 10.5)
    if (localT >= 9.8 && localT < 11.6) {
      s.audioSpike = true;
    }
    // 11.8s+ : phone appears (violation @ 12.5)
    if (localT >= 11.8) {
      const p = clamp((localT-11.8)/0.4, 0, 1);
      s.phone = p;
      // Eyes glance down at phone
      s.gazeY = lerp(s.gazeY, 0.4, p);
      s.gazeX = lerp(s.gazeX, 0.3, p);
    }
    return s;
  })();
  const sevC = {CRITICAL:{fg:C.critical,bg:C.critBg},ERROR:{fg:C.error,bg:C.errorBg},WARN:{fg:C.warn,bg:C.warnBg},INFO:{fg:C.info,bg:C.infoBg}};
  // Stepwise risk: jumps at each violation, sized by severity, with smooth ease-in
  const riskJump = {WARN:0.10, INFO:0.06, ERROR:0.16, CRITICAL:0.24};
  const riskV = (() => {
    let r = 0.08; // baseline
    VIOLS.forEach(v => {
      if (localT >= v.time) {
        const p = clamp((localT - v.time)/0.6, 0, 1);
        r += riskJump[v.sev] * easeInOut(p);
      }
    });
    return Math.min(0.94, r);
  })();
  const riskPct = Math.round(riskV*100);
  const riskC   = riskV>0.7?C.critical:riskV>0.4?C.error:riskV>0.2?C.warn:C.success;

  const IconPath = ({icon}) => {
    if(icon==='eye-off') return <><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></>;
    if(icon==='layout')  return <><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></>;
    if(icon==='user')    return <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>;
    if(icon==='users')   return <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>;
    if(icon==='volume-2')return <><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></>;
    if(icon==='smartphone')return <><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></>;
    return null;
  };

  return (
    <div style={{opacity:visible,overflow:'hidden',fontFamily:"'IBM Plex Sans',sans-serif",position:'relative'}}>
      <BrowserChrome url="app.procta.in/live/cs301" light={false}>
        <div style={{height:620,background:C.bgBase,color:C.hiText,display:'flex',flexDirection:'column'}}>
          {/* Topbar */}
          <div style={{height:42,display:'flex',alignItems:'center',gap:12,padding:'0 14px',background:C.bgInset,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
            <PrLogo size={15} color={C.accent}/>
            <span style={{fontSize:12,fontWeight:700,color:C.midText}}>procta</span>
            <div style={{width:1,height:17,background:C.border}}/>
            <span style={{fontSize:12,fontWeight:500,color:C.midText}}>CS301 — Violation Feed</span>
            <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
              <div style={{display:'flex',alignItems:'center',gap:4,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.midText}}>
                <div style={{width:5,height:5,borderRadius:'50%',background:C.success}}/>LIVE
              </div>
              <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mutedText}}>47 students</span>
            </div>
          </div>
          {/* Two-col */}
          <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr 300px',overflow:'hidden'}}>
            {/* Left: Vision panel + Feed */}
            <div style={{borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
              {/* Connector overlay: avatar → most recent violation row */}
              {(() => {
                const recent = [...VIOLS].reverse().find(v => localT >= v.time);
                if (!recent) return null;
                const age = localT - recent.time;
                // Pulse: appears 0.05s after violation, fades by 1.4s
                const op = easeOut(clamp(age/0.25, 0, 1)) * (1 - clamp((age-0.9)/0.5, 0, 1));
                if (op < 0.02) return null;
                const sc = sevC[recent.sev] || sevC.INFO;
                // Avatar bounds: x=14..314 (avatar is 300w at left:14), y=~46..234 inside container
                // First feed card sits at top of feed section; container layout = vision header (40h) + vision body (~210h) + feed header (35h) = ~285h before first card
                // First card top ≈ 290, height ≈ 60, so target y ≈ 320
                const ax = 314, ay = 140;          // avatar right-mid
                const tx = 360, ty = 322;          // first violation card left edge
                // Bezier control points for a soft S-curve
                const c1x = ax + 28, c1y = ay + 20;
                const c2x = tx - 18, c2y = ty - 30;
                const path = `M ${ax} ${ay} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}`;
                return (
                  <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:5,overflow:'visible'}}>
                    <defs>
                      <marker id={`arr-${recent.sev}`} viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill={sc.fg}/>
                      </marker>
                    </defs>
                    <path d={path} fill="none" stroke={sc.fg} strokeWidth="1.6" strokeDasharray="4 3" opacity={op*0.85} markerEnd={`url(#arr-${recent.sev})`}/>
                    <circle cx={ax} cy={ay} r={6} fill="none" stroke={sc.fg} strokeWidth="1.5" opacity={op*0.7}>
                      <animate attributeName="r" from="4" to="14" dur="0.9s" repeatCount="indefinite"/>
                      <animate attributeName="opacity" from={op*0.7} to="0" dur="0.9s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx={ax} cy={ay} r={3} fill={sc.fg} opacity={op}/>
                  </svg>
                );
              })()}
              {/* AI Vision panel */}
              <div style={{padding:'10px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                <span style={{fontSize:12,fontWeight:600,color:C.hiText}}>AI Vision · Priya Sharma</span>
                <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:C.mutedText}}>Roll 2041 · S-8841</span>
                <span style={{marginLeft:'auto',fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:C.mutedText}}>30 fps · YOLO-v8 + MediaPipe</span>
              </div>
              <div style={{padding:'10px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',gap:12,flexShrink:0,background:C.bgInset}}>
                <AvatarCam state={avatar} w={300} h={188} label="S-8841 · live"/>
                <div style={{flex:1,display:'flex',flexDirection:'column',gap:6,minWidth:0}}>
                  <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:C.mutedText}}>Detection signals</div>
                  {[
                    {l:'Face presence', v: avatar.faceVisible ? 'Detected' : 'Lost', ok: avatar.faceVisible},
                    {l:'Gaze on-screen', v: Math.abs(avatar.gazeX)>0.6||Math.abs(avatar.gazeY)>0.6 ? 'Off-screen' : 'On-screen', ok: Math.abs(avatar.gazeX)<=0.6 && Math.abs(avatar.gazeY)<=0.6},
                    {l:'Head pose (yaw)', v: `${Math.round(avatar.headRot)}°`, ok: Math.abs(avatar.headRot)<25},
                    {l:'Faces in frame', v: avatar.secondFace ? '2' : '1', ok: !avatar.secondFace},
                    {l:'Phone detected', v: avatar.phone ? 'Yes' : 'No', ok: !avatar.phone},
                    {l:'Audio level', v: avatar.audioSpike ? 'Spike' : 'Normal', ok: !avatar.audioSpike},
                  ].map(r => (
                    <div key={r.l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:10}}>
                      <span style={{color:C.mutedText}}>{r.l}</span>
                      <span style={{display:'inline-flex',alignItems:'center',gap:5,fontFamily:"'IBM Plex Mono',monospace",color:r.ok?C.success:C.error}}>
                        <span style={{width:5,height:5,borderRadius:'50%',background:r.ok?C.success:C.error,boxShadow:r.ok?'none':`0 0 6px ${C.error}`}}/>
                        {r.v}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
              {/* Feed */}
              <div style={{padding:'8px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                <span style={{fontSize:12,fontWeight:600,color:C.hiText}}>Violation Events</span>
                <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,background:C.errorBg,color:C.error,padding:'1px 6px',borderRadius:3,border:`1px solid ${C.error}44`}}>{VIOLS.filter(v=>localT>v.time).length}</span>
              </div>
              <div style={{flex:1,overflowY:'auto',padding:10,display:'flex',flexDirection:'column',gap:7}}>
                {VIOLS.map((v,i)=>{
                  if(localT<v.time) return null;
                  const rowOp = easeOut(clamp((localT-v.time)/0.4,0,1));
                  const rowY  = lerp(14,0,easeOut(clamp((localT-v.time)/0.45,0,1)));
                  const sc    = sevC[v.sev]||sevC.INFO;
                  const isNew = localT-v.time<1.5;
                  return (
                    <div key={i} style={{opacity:rowOp,transform:`translateY(${rowY}px)`,background:isNew?`oklch(from ${sc.fg} l c h / 0.07)`:C.surf1,border:`1px solid ${isNew?sc.fg+'55':C.border}`,borderRadius:7,padding:'9px 11px',display:'flex',alignItems:'flex-start',gap:9}}>
                      <div style={{width:26,height:26,borderRadius:5,background:sc.bg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={sc.fg} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><IconPath icon={v.icon}/></svg>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:2}}>
                          <span style={{fontSize:12,fontWeight:600,color:C.hiText}}>{v.text}</span>
                          <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,background:sc.bg,color:sc.fg,padding:'1px 5px',borderRadius:3,flexShrink:0,marginLeft:6,border:`1px solid ${sc.fg}44`}}>{v.sev}</span>
                        </div>
                        <div style={{fontSize:10,color:C.mutedText}}>{v.sub}</div>
                        <div style={{marginTop:4,fontFamily:"'IBM Plex Mono',monospace",fontSize:9,color:C.mutedText}}>Priya Sharma · {Math.floor(localT-v.time)}s ago</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            {/* Risk panel */}
            <div style={{display:'flex',flexDirection:'column',overflow:'hidden'}}>
              <div style={{padding:14,borderBottom:`1px solid ${C.border}`}}>
                <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:C.mutedText,marginBottom:9}}>Student Risk Index</div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:7}}>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:28,fontWeight:500,letterSpacing:'-0.02em',color:riskC}}>{riskPct}<span style={{fontSize:14}}>%</span></span>

              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </div>
            <div style={{padding:'13px 22px',color:C.info,border:`1px solid ${C.accent}`,borderRadius:8,fontSize:14,fontWeight:500,cursor:'pointer'}}>procta.in</div>

          <div style={{opacity:fadeIn(t,87,0.4),display:'flex',flexDirection:'column',gap:8,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:C.mutedText,letterSpacing:'0.02em'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.mutedText} strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              hello@procta.in

            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.mutedText} strokeWidth="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              +91 80 4718 2200 · Bengaluru
            </div>
          </div>
        </div>
        {/* Right: feature recap */}
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div style={{opacity:fadeIn(t,85,0.4),fontSize:10,fontWeight:600,letterSpacing:'0.14em',textTransform:'uppercase',color:C.accent,marginBottom:2}}>What you just saw</div>
          {FEATS.map((f,i)=>(
            <div key={i} style={{

                    const a = (k*15)*Math.PI/180;
                    return <line key={k} x1="10" y1="10" x2={10+Math.cos(a)*4.4} y2={10+Math.sin(a)*4.4} stroke="#000080" strokeWidth="0.4"/>;

// ─────────────────────────────────────────────────────────────────────────
// ── Main scene router ────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────
function DemoContent({ showCallouts }) {
  const t = useTime();

  const showS0 = t < 7;
  const showS1 = t >= 5.5 && t < 19;
  const showS2 = t >= 17.5 && t < 35;
  const showS3 = t >= 33.5 && t < 49.2;
  const showS4 = t >= 47.3 && t < 67;
  const showS5 = t >= 65.5 && t < 85;
  const showS6 = t >= 83.5;

  // Wrapper for browser-chrome scenes — dark or light outer bg
  // position:relative so stage-coord callouts work
  const BW = ({ children, light=false }) => (
    <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',padding:'22px 48px',background:light?'oklch(88% 0.006 240)':'oklch(6% 0.006 240)'}}>
      <div style={{width:'100%',maxWidth:1440,position:'relative'}}>{children}</div>
    </div>
  );

  // ── Stage-level callout overlay (1920×1080 coords) ───────────────────
  // Chrome is centered inside BW: left edge = (1920-1440)/2 = 240px
  // Chrome top = 22px (padding). Chrome header = 36px.
  // Content top = 22+36 = 58px. Content height = 620px.
  // Sidebar width = 180px → sidebar right edge = 240+180 = 420px
  // Question area: x=420 to x=240+1440=1680
  // Light-bg scenes (S4,S5): same geometry

  // S2 callout coords (student exam)
  const s2_c1 = showCallouts ? fadeIn(t,19.5,0.4)*(t>33?fadeOut(t,33,0.5):1) : 0;
  const s2_c2 = showCallouts ? fadeIn(t,22,0.4)  *(t>33?fadeOut(t,33,0.5):1) : 0;
  const s2_c3 = showCallouts ? fadeIn(t,26,0.4)  *(t>33?fadeOut(t,33,0.5):1) : 0;
  const s2_c4 = showCallouts ? fadeIn(t,30,0.4)  *(t>33?fadeOut(t,33,0.5):1) : 0;

  // S3 callout coords (violations)
  const s3_c1 = showCallouts ? fadeIn(t,35.5,0.4)*(t>47?fadeOut(t,47,0.5):1) : 0;
  const s3_c2 = showCallouts ? fadeIn(t,39,0.4)  *(t>47?fadeOut(t,47,0.5):1) : 0;

  // S4 callout coords (teacher dashboard)
  const s4_c1 = showCallouts ? fadeIn(t,49.5,0.4)*(t>65?fadeOut(t,65,0.5):1) : 0;
  const s4_c2 = showCallouts ? fadeIn(t,53,0.4)  *(t>65?fadeOut(t,65,0.5):1) : 0;
  const s4_c3 = showCallouts ? fadeIn(t,58,0.4)  *(t>65?fadeOut(t,65,0.5):1) : 0;
  const s4_c4 = showCallouts ? fadeIn(t,62,0.4)  *(t>65?fadeOut(t,65,0.5):1) : 0;

  // S5 callout coords (analytics)
  const s5_c1 = showCallouts ? fadeIn(t,67.5,0.4)*(t>83?fadeOut(t,83,0.5):1) : 0;
  const s5_c2 = showCallouts ? fadeIn(t,71,0.4)  *(t>83?fadeOut(t,83,0.5):1) : 0;
  const s5_c3 = showCallouts ? fadeIn(t,76,0.4)  *(t>83?fadeOut(t,83,0.5):1) : 0;

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
      {showS0 && <div style={{position:'absolute',inset:0}}><Scene0 t={t}/></div>}
      {showS1 && <BW><Scene1 t={t} showCallouts={showCallouts}/></BW>}
      {showS2 && <BW><Scene2 t={t}/></BW>}
      {showS3 && <BW><Scene3 t={t}/></BW>}
      {showS4 && <BW light><Scene4 t={t}/></BW>}
      {showS5 && <BW light><Scene5 t={t}/></BW>}
      {showS6 && <div style={{position:'absolute',inset:0}}><Scene6 t={t}/></div>}

      {/* ── Stage-level callouts overlay — 1920×1080 coords ── */}
      {/* Chrome geometry: left=240, top=22, header=36, content starts y=58 */}

      {/* S2: Student Exam */}
      {/* Chrome: left=240, top=211, header=36 → content y=247. Content h=620 → bottom=867 */}
      {/* Sidebar right edge = 240+180 = 420. Question area: x=420–1680 */}
      {showS2 && <>
        {/* Camera preview in header: x≈312, y≈247 → label sits just below header inside content */}
        <Callout ax={312} ay={247} lx={260} ly={140} opacity={s2_c1} accent>Camera monitored in real time</Callout>
        {/* Browser lock in URL bar: x≈480, y≈247 → label above the chrome */}
        <Callout ax={480} ay={247} lx={520} ly={170} opacity={s2_c1} accent>Locked browser — no tab switching</Callout>
        {/* Flagged Q in sidebar: x≈362, y≈430 → label below chrome */}
        <Callout ax={362} ay={430} lx={260} ly={900} opacity={s2_c2}>Flag for review, jump to any Q</Callout>
        {/* Progress bar in sidebar: x≈330, y≈360 → label below chrome */}
        <Callout ax={330} ay={360} lx={560} ly={900} opacity={s2_c2}>Progress auto-saved</Callout>
        {/* Answer option in question area: x≈700, y≈530 → label below chrome */}
        <Callout ax={700} ay={530} lx={820} ly={940} opacity={s2_c3}>Clean, distraction-free layout</Callout>
        {/* Chat drawer: x≈1390, y≈750 → label above-right */}
        <Callout ax={1390} ay={750} lx={1500} ly={170} opacity={s2_c4} accent>Direct chat with invigilator</Callout>
      </>}

      {/* S3: AI Violations */}
      {/* Chrome top=211, header=42 → content y=253. Feed panel w≈1140, risk panel x=240+1140=1380–1680 */}
      {showS3 && <>
        {/* First violation card: x≈600, y≈295 → label above chrome */}
        <Callout ax={600}  ay={295} lx={300} ly={140} opacity={s3_c1}>Real-time AI event classification</Callout>
        {/* Second violation card: x≈600, y≈360 → label below chrome */}
        <Callout ax={600}  ay={360} lx={300} ly={920} opacity={s3_c1}>6 violation types detected automatically</Callout>
        {/* Risk % number: x≈1480, y≈340 → label above chrome */}
        <Callout ax={1480} ay={340} lx={1240} ly={140} opacity={s3_c2} accent>Composite risk score per student</Callout>
        {/* Risk progress bar: x≈1480, y≈390 → label below chrome */}
        <Callout ax={1480} ay={390} lx={1240} ly={920} opacity={s3_c2} accent>Escalates live throughout exam</Callout>
      </>}

      {/* S4: Teacher Dashboard (light bg) */}
      {/* Chrome top=211, header=42 → content y=253. Tabbar=34→287. Statsbar=46→333. Table starts y≈333 */}
      {/* Detail panel x=240+1200=1440 to 1680 */}
      {showS4 && <>
        {/* Table name column: x≈550, y≈370 → label above chrome */}
        <Callout ax={550}  ay={370} lx={300} ly={140} opacity={s4_c1} accent>Full cohort at a glance</Callout>
        {/* Stats bar — Flagged chip: x≈480, y≈305 → label above chrome */}
        <Callout ax={480}  ay={305} lx={620} ly={170} opacity={s4_c1} accent>Sort by risk, name, or event</Callout>
        {/* Risk value cell: x≈1400, y≈390 → label below chrome */}
        <Callout ax={1400} ay={390} lx={1180} ly={920} opacity={s4_c2}>Live risk scores — auto-updated</Callout>
        {/* Severity badge: x≈1320, y≈410 → label below chrome */}
        <Callout ax={1320} ay={410} lx={1450} ly={920} opacity={s4_c2}>Colour-coded severity badges</Callout>
        {/* Detail panel header: x≈1580, y≈430 → label above chrome */}
        <Callout ax={1580} ay={430} lx={1380} ly={140} opacity={s4_c3} accent>Student detail panel on click</Callout>
        {/* Broadcast button: x≈1530, y≈335 → label above chrome */}
        <Callout ax={1530} ay={335} lx={1480} ly={170} opacity={s4_c4}>Broadcast to all students</Callout>
      </>}

      {/* S5: Analytics (light bg) */}
      {/* Chrome top=211, header=42→253, chips=58→311, charts grid starts y≈311 */}
      {/* Left cards x=240–840, right cards x=840–1680 */}
      {showS5 && <>
        {/* Score histogram bars: x≈540, y≈430 → label above chrome */}
        <Callout ax={540}  ay={430} lx={300} ly={140} opacity={s5_c1} accent>Score distribution across cohort</Callout>
        {/* Export button in topbar: x≈1600, y≈253 → label above chrome */}
        <Callout ax={1600} ay={253} lx={1380} ly={170} opacity={s5_c1} accent>Exportable PDF & CSV reports</Callout>
        {/* Risk band bars: x≈1200, y≈460 → label above chrome */}
        <Callout ax={1200} ay={460} lx={1080} ly={140} opacity={s5_c2}>AI risk bands per student</Callout>
        {/* Difficulty chart bars: x≈540, y≈620 → label below chrome */}
        <Callout ax={540}  ay={620} lx={300} ly={920} opacity={s5_c3}>Per-question difficulty breakdown</Callout>
        {/* Violation heatmap: x≈1200, y≈640 → label below chrome */}
        <Callout ax={1200} ay={640} lx={1080} ly={920} opacity={s5_c3} accent>Violation heatmap: Q × time</Callout>
      </>}

      {/* Wipe transitions — longer + mid-tone at dark↔light boundaries */}
      <SceneWipe t={t} at={6}  dur={0.4}/>
      <SceneWipe t={t} at={18} dur={0.4}/>
      <SceneWipe t={t} at={34} dur={0.4}/>
      <SceneWipe t={t} at={48} dur={0.9} color="oklch(50% 0.01 240)"/>
      <SceneWipe t={t} at={66} dur={0.6}/>
      <SceneWipe t={t} at={84} dur={0.7} color="oklch(45% 0.012 240)"/>

      <ChapterDots t={t}/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// ── Root app with Tweaks ─────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showCallouts": true,
  "speed": 1
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <Stage
        width={1920}
        height={1080}
        duration={DURATION}
        background="oklch(6% 0.006 240)"
        speed={tweaks.speed}
      >
        <DemoContent showCallouts={tweaks.showCallouts}/>
      </Stage>

      <TweaksPanel>
        <TweakSection label="Video">
          <TweakToggle
            label="Feature callout labels"
            value={tweaks.showCallouts}
            onChange={v => setTweak('showCallouts', v)}
          />
          <TweakSlider
            label="Playback speed"
            value={tweaks.speed}
            min={0.25} max={2} step={0.25}
            onChange={v => setTweak('speed', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
