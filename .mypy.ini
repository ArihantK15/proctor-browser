[mypy]
python_version = 3.12

warn_return_any = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
warn_no_return = True

check_untyped_defs = True
strict_optional = True
no_implicit_optional = True
disallow_untyped_defs = True

disable_error_code = import-untyped, no-any-return, no-untyped-def, no-untyped-call, call-overload, unused-ignore

exclude = \.venv/|\.mypy_cache/|__pycache__/|tests/|node_modules/|app/dashboard-ui/|app/student-ui/|website/|\.git/|app/auth/admin_auth\.py$|app/auth/tokens\.py$|app/jobs/email_jobs\.py$|app/jobs/event_jobs\.py$|app/lti/launch\.py$|app/repositories/questions\.py$|app/routers/admin_coding\.py$

[mypy-app.*]
ignore_missing_imports = True

[mypy-tests.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-starlette.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-razorpay.*]
ignore_missing_imports = True

[mypy-pypdfium2.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True
