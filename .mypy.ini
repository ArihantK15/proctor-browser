[mypy]
python_version = 3.12

# Strict-mode flags (equivalent to `--strict`)
warn_unused_configs = True
disallow_any_unimported = True
# disallow_any_decorated: FastAPI/Starlette route decorators are untyped,
# causing "Type of decorated function contains type 'Any'" on every handler.
# Kept disabled — fixing would require annotating every route, which offers
# no runtime benefit and makes the type-checking signal-to-noise ratio worse.
# disallow_any_decorated = True
disallow_subclassing_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
strict_equality = True
no_implicit_reexport = True
strict_optional = True
warn_unused_ignores = True
warn_no_return = True

# Suppress pre-existing codebase issues unrelated to strict-mode migration
disable_error_code = import-untyped, no-any-return, no-untyped-def, no-untyped-call, call-overload

exclude = \.venv/|\.mypy_cache/|__pycache__/|tests/|node_modules/|app/dashboard-ui/|app/student-ui/|website/|\.git/

[mypy-app.*]
ignore_missing_imports = True

[mypy-tests.*]
ignore_missing_imports = True
disallow_untyped_defs = False

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-starlette.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-razorpay.*]
ignore_missing_imports = True

[mypy-pypdfium2.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True
