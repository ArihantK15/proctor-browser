name: Build & Release Electron App

# Triggered by pushing a version tag (e.g. `git tag v2.1.4 && git push --tags`).
# Each runner builds its own OS target and publishes straight to the GitHub
# Release associated with the tag — including the latest.yml / latest-mac.yml
# manifests and .blockmap files that electron-updater needs.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for debugging without creating a new tag
  workflow_dispatch:

permissions:
  contents: write  # needed so electron-builder can create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          # Pin the minimum supported Node 22 line explicitly: Vite 8,
          # Puppeteer 25, and the React plugin require Node >=22.12.
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        # Strict — if package-lock.json is out of sync, fail loudly. The
        # earlier `|| npm install` fallback silently regenerated the lock
        # in CI which defeated the lockfile's purpose and let drift land
        # in release builds.
        run: npm ci

      # Build BOTH mac archs in a single invocation so latest-mac.yml
      # references both DMGs. Separate runs would overwrite the manifest.
      #
      # Signing path is gated on the CSC_LINK secret being non-empty.
      # When the secret is unset, an empty-string CSC_LINK gets handed
      # to electron-builder, which interprets it as a cert path and dies
      # with a misleading "<workdir> not a file" error AFTER fuses. So
      # we branch in the shell: with a cert we sign + notarize; without
      # we explicitly pass -c.mac.identity=null to skip signing cleanly.
      - name: Build & publish (macOS)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "Signing enabled — CSC_LINK provided."
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            npx electron-builder --mac --arm64 --x64 --publish always
          else
            echo "No CSC_LINK secret — building UNSIGNED with identity=null."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --arm64 --x64 --publish always \
              -c.mac.identity=null
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass secrets in via *_SECRET names; the step above only exports
          # the electron-builder-recognized names when the secret is present.
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}

      # Same defensive pattern for Windows. Without a cert the EXE is
      # unsigned and triggers SmartScreen on first-run, but the build
      # itself must not abort.
      - name: Build & publish (Windows)
        if: matrix.target == 'win'
        shell: bash
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "Signing enabled — CSC_LINK provided."
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            npx electron-builder --win --x64 --publish always
          else
            echo "No CSC_LINK secret — building UNSIGNED."
            npx electron-builder --win --x64 --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Show dist contents
        shell: bash
        run: ls -lh dist/ || true
