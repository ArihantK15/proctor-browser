<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1629" />

    <!--
      Favicon stack — Google's SERP crawler prefers a ≥48×48 PNG over an
      SVG; without one it re-rasterises and the result looks smudged in
      search results. We ship SVG for modern browsers AND PNGs at every
      size Google + Apple + Windows ask for. Order matters: browsers pick
      the first acceptable match.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary SEO -->
    <title>Procta — Remote exams. Real results. | AI-Proctored Exam Platform</title>
    <meta name="description" content="Procta — Remote exams. Real results. AI-proctored exam platform for Indian higher education and coaching institutes. On-device gaze tracking, face detection, and object recognition. Free 14-day trial." />
    <meta name="keywords" content="AI proctored exam, online proctoring software, remote exam platform, AI exam proctoring, anti-cheating software, online test proctoring, secure online exams, proctored exam platform, gaze tracking proctoring, exam software India" />
    <meta name="author" content="Procta" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://procta.net/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://procta.net/" />
    <meta property="og:title" content="Procta — Remote exams. Real results." />
    <meta property="og:description" content="AI-proctored exam platform for Indian higher education. Gaze tracking, face detection, and object recognition — all on-device. Free 14-day trial." />
    <meta property="og:image" content="https://procta.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Procta — Remote exams. Real results." />
    <meta property="og:site_name" content="Procta" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Procta — Remote exams. Real results." />
    <meta name="twitter:description" content="AI-proctored exam platform for Indian higher education. Gaze tracking, face detection, object recognition — all on-device. Free 14-day trial." />
    <meta name="twitter:image" content="https://procta.net/og-image.png" />

    <!-- Structured Data: SoftwareApplication
         Note: `slogan` is NOT a valid property on SoftwareApplication
         (schema.org defines it only on Organization + Place). The brand
         promise lives on the Organization block below — Google merges
         the two when rendering the knowledge panel. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Procta",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Windows, macOS",
      "description": "AI-proctored exam platform that detects cheating in real time using on-device gaze tracking, face detection, and object recognition.",
      "url": "https://procta.net",
      "image": "https://procta.net/og-image.png",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR",
        "description": "Free 14-day trial — no credit card required"
      },
      "featureList": [
        "AI gaze tracking and calibration",
        "Real-time face detection",
        "Cheat object detection (phone, book, earphones)",
        "Identity verification with teacher approval",
        "Kiosk-mode exam lockdown",
        "Phone-cam secondary view",
        "On-device processing for privacy",
        "Teacher dashboard with forensics timeline"
      ]
    }
    </script>

    <!-- Structured Data: Organization — the canonical home for `slogan` +
         `logo`. Google uses these to populate the SERP brand card and
         knowledge panel. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Procta",
      "slogan": "Remote exams. Real results.",
      "url": "https://procta.net",
      "logo": "https://procta.net/icon-512.png",
      "image": "https://procta.net/og-image.png",
      "sameAs": [
        "https://procta.net"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contact@procta.net",
        "contactType": "customer support",
        "areaServed": "IN",
        "availableLanguage": ["en", "hi"]
      }
    }
    </script>

    <!-- WebSite + SearchAction omitted: we do not yet have a site search
         endpoint that responds to ?q=. Re-enable once /search is wired
         up to filter blog/features content. -->


    <!-- Fonts are served from the static bundle via @fontsource packages.
         No Google Fonts round-trip needed. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:40px;font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;color:#e2e8f0;background:#0f172a;min-height:100vh">
        <h1 style="font-size:24px;margin-bottom:12px">Procta — AI-Proctored Exam Platform</h1>
        <p style="line-height:1.6;margin-bottom:16px">
          AI-proctored exam platform for Indian higher education and coaching institutes.
          On-device gaze tracking, face detection, and object recognition.
          <a href="https://procta.net" style="color:#60a5fa">Learn more at procta.net</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
