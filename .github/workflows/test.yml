name: Tests

# Run the Python test suite on every push and PR. The Electron build
# workflow only fires on version tags, which means main could rot for
# weeks before CI noticed. This job catches regressions immediately.
#
# Tests use a stubbed Supabase client (see tests/conftest.py) so we
# don't need real DB credentials in CI — that's also why this job is
# safe to run on PRs from forks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v6
        with:
          # Pin the minimum supported Node 22 line explicitly: Vite 8,
          # Puppeteer 25, and the React plugin require Node >=22.12.
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/dashboard-ui/package-lock.json
            app/student-ui/package-lock.json
            website/package-lock.json

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-asyncio pytest-cov

      - name: Compile-check Python sources
        # Catches syntax errors before pytest tries to collect — gives
        # a much clearer failure message than the test runner would.
        run: |
          python -c "
          import ast, os, sys
          bad = []
          for root, _, files in os.walk('app'):
              if '__pycache__' in root: continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try: ast.parse(open(p).read())
                      except SyntaxError as e: bad.append(f'{p}:{e.lineno}: {e.msg}')
          if bad:
              for b in bad: print(b)
              sys.exit(1)
          print('All Python files parse cleanly.')
          "

      - name: Schema-reference guard
        # Fails the build if app code SELECTs / filters / writes a column
        # that does not exist in the committed live-schema snapshot
        # (schema/columns.json). Catches the UndefinedColumnError -> 500
        # class that caused a run of prod incidents (students.exam_id,
        # student_invites.phone, appeals.email, ...) which the schema-blind
        # test stubs never noticed. Stdlib-only; no DB access. Skips with a
        # notice until the snapshot is seeded from prod via
        # scripts/dump_schema.py — so this is safe to land before seeding.
        run: python scripts/check_schema_refs.py

      - name: Postgres select-syntax guard
        # Fails the build if any .select("…") uses PostgREST syntax the postgres
        # backend rejects (column aliases "a:b", embedded resources "x(y)") →
        # ValueError → 500. The mocked unit suite can't see it; we hit this in
        # api.py and lti/deeplink.py. Stdlib-only; no DB access.
        run: python scripts/check_pg_select_syntax.py

      - name: Tenant-scoping guard
        # Fails the build if an authed endpoint reads/writes a tenant table with
        # NO tenancy scoping (scope spine / owner teacher_id|org_id filter /
        # ownership check) — the cross-tenant-leak class. Endpoints scoped by a
        # non-teacher axis (student account / invite token / health probe) are
        # allow-listed in the script with a reason. Stdlib-only; no DB access.
        run: python scripts/check_tenant_scoping.py

      - name: Admin-rollup guard
        # Sibling of the tenant-scoping guard. Fails the build if a require_admin
        # endpoint filters a tenant table by the caller's OWN teacher_id without
        # the rollup scope spine — the "org admin silently sees only their own
        # slice" class (failed-sessions, invites, pending-grades, groups, …).
        # Deliberate owner-only mutations + the private question-bank library are
        # allow-listed in the script with a reason. Stdlib-only; no DB access.
        run: python scripts/check_admin_rollup.py

      - name: Install + lint Electron dependencies
        run: |
          npm ci
          npm run lint
          npm audit --audit-level=low

      - name: Build dashboard
        run: |
          cd app/dashboard-ui
          npm ci
          npm audit --audit-level=low
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Build student UI
        run: |
          cd app/student-ui
          npm ci
          npm audit --audit-level=low
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Build marketing site
        run: |
          cd website
          npm ci
          npm audit --audit-level=low
          npm run lint
          npm run build

      - name: Run pytest
        env:
          # Stub values — tests/conftest.py replaces the real client
          # before any test imports app.main. These just satisfy the
          # `os.environ[...]` reads at import time.
          # Must match the value tests/conftest.py sets via setdefault.
          # Tests like test_hybrid_oauth_..._keeps_supabase_provider
          # assert netloc == "fake.supabase.co"; setting a different
          # URL here overrides conftest's setdefault and breaks them.
          SUPABASE_URL: "https://fake.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "stub"
          # Must be >= 32 chars — app/constants.py enforces this when
          # ENV is unset (which CI is, by design — fail-closed posture).
          # Previous value `stub-jwt-secret-please-rotate` was 29 chars,
          # tripping the guard and crashing pytest collection.
          SUPABASE_JWT_SECRET: "stub-jwt-secret-please-rotate-ci-test-only-do-not-use-anywhere"
          ADMIN_PASSWORD: "stub-admin-password"
        # `--ignore=tests/browser`: the browser tests use Playwright +
        #   real Chromium, which we don't install in this lightweight
        #   CI job. Browser tests get their own workflow if/when we
        #   wire that up.
        # `--ignore=tests/test_proctor_e2e.py --ignore=tests/test_proctor_features.py
        #   --ignore=tests/test_proctor_onnx_detection.py`:
        #   proctor tests need cv2/numpy/onnxruntime/insightface which
        #   are heavy, GPU-optional deps not needed for the server API.
        #   They are run locally before commits.
        # No `-x`: a single transient flake shouldn't mask the rest of
        #   the suite. We want to see ALL failures on each push so a
        #   regression in one area doesn't hide one in another.
        run: |
          pytest tests/ \
            --ignore=tests/browser \
            --ignore=tests/test_proctor_e2e.py \
            --ignore=tests/test_proctor_features.py \
            --ignore=tests/test_proctor_onnx_detection.py \
            --cov=app --cov-report=xml --cov-report=term \
            -v --tb=short

      # Coverage upload — uses Codecov's tokenless OIDC flow for public
      # repos. No CODECOV_TOKEN secret required. Failures here are
      # non-fatal: a coverage upload glitch must not red-x the test
      # job that already passed.
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: pytest
          fail_ci_if_error: false

  # Electron integration smoke (lobby / exam window / sub-frame guard /
  # fail-open) driven via CDP — see scripts/electron-e2e.mjs.
  #
  # NON-BLOCKING for now: this GUI test has not yet proven stable in CI, so
  # `continue-on-error` keeps a flake/timeout from red-failing the pipeline
  # or blocking a PR. Once it is green across several real runs, remove
  # `continue-on-error` to promote it to a required gate. Runs on macOS
  # because that is where Electron is known to launch in CI (the release
  # build's signature gate already spawns it there). No `needs:` so it can
  # never gate another job.
  e2e-electron:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Electron e2e (lobby / exam window / sub-frame guard / fail-open)
        run: npm run test:e2e

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pytest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t proctor-api:ci .

      - name: Start Redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --save ""

      - name: Start API container
        run: |
          docker run -d --name api --network host \
            -e SUPABASE_URL=https://fake.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=stub \
            -e SUPABASE_JWT_SECRET=stub-jwt-secret-please-rotate-ci-test-only-do-not-use-anywhere \
            -e ADMIN_PASSWORD=stub-admin-password \
            -e REDIS_URL=redis://localhost:6379 \
            -e CORS_ORIGINS=http://localhost:8000 \
            -e EMAIL_PROVIDER=noop \
            -e EMAIL_FROM=test@procta.net \
            -e SUPABASE_SKIP_STARTUP_CHECK=1 \
            -e SCREENSHOTS_DIR=/tmp/proctor-screenshots \
            proctor-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            sleep 3
          done
          echo "API failed to start"
          docker logs api
          exit 1

      - name: Run smoke test
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/loadtest:/scripts:ro" \
            -e TARGET=http://localhost:8000 \
            grafana/k6:0.54.0 run /scripts/smoke.js

      - name: Clean up
        if: always()
        run: docker rm -f api redis || true

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action@v2 (currently v2.3.9) still ships a node20
          # entrypoint, which GitHub deprecates after 2026-06-16. No v2
          # RELEASE uses node24 yet (only the default branch + v3.x), so
          # rather than jump majors we keep @v2 and force it onto the
          # Node 24 runtime — GitHub's documented opt-in for this exact case.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      - name: Semgrep SAST
        # Direct CLI invocation rather than semgrep/semgrep-action@v1
        # so we can pass --exclude-rule and --exclude reliably. The
        # action's inline nosemgrep handling proved unreliable.
        #
        # Excluded RULES (false positives in production code — see
        # inline `# nosemgrep:` comments at each site for rationale):
        #   asyncpg-sqli            — $N parameterized queries with
        #                             literal SQL constants in VALUES
        #   jwt-python-exposed-data — generic RS256 signer for LTI
        #                             AGS; internal callers only
        #   missing-integrity       — Cloudflare Turnstile rolls
        #                             api.js content; SRI impossible
        #   path-join-resolve-      — build/afterPack.js joins
        #   traversal                 electron-builder's own build-time
        #                             context (appOutDir + productFilename),
        #                             never user input; runs on CI host only
        #
        # Excluded PATHS:
        #   tests/    — test code deliberately decodes JWTs without
        #               verification (to inspect token bodies), asserts
        #               plain websocket URLs, and uses importlib for
        #               introspection. Not production code paths.
        #   .github/  — workflow YAML is CI config, not app code.
        #               (Also, Semgrep flagged the previous version
        #               of this very comment because the literal
        #               string `ws` + `://` matched the websocket rule.)
        run: |
          python -m pip install --quiet "semgrep>=1.76.0"
          semgrep --config auto \
            --error \
            --exclude tests \
            --exclude .github \
            --exclude-rule "python.lang.security.audit.sqli.asyncpg-sqli.asyncpg-sqli" \
            --exclude-rule "python.jwt.security.audit.jwt-exposed-data.jwt-python-exposed-data" \
            --exclude-rule "html.security.audit.missing-integrity.missing-integrity" \
            --exclude-rule "javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal" \
            --exclude-rule "javascript.lang.security.detect-child-process.detect-child-process" \
            .
            # detect-child-process: an ADVISORY rule ("you used child_process").
            # All our usage spawns python / system tools (pip, tar, taskkill,
            # the bundled interpreter) with BUILD-CONTROLLED paths + hardcoded
            # commands — no request/user input. The rules that catch the actual
            # injection risk (spawn-shell-true, unsafe-formatstring) stay ACTIVE.
            # This was blocking the whole Tests workflow — and therefore the
            # Deploy API job gated on it — after per-arch wheel-baking added
            # execSync calls to bundle-python.js.

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            aquasec/trivy:0.50.1 fs \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace

  # Real-Postgres integration tests. The unit `pytest` job mocks the database
  # entirely (tests/conftest.py), so schema/column bugs slip through. This job
  # runs integration_tests/ — which live OUTSIDE tests/ specifically so the mock
  # never applies — against a live Postgres, exercising the real asyncpg query
  # builder + SQL on the highest-risk paths (billing entitlement/idempotency,
  # tenant-scope isolation) and proving phase96 applies on top of the fixture.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: procta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/procta
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-asyncio

      - name: Integration tests (real Postgres)
        # `python -m pytest` (not the bare console script) so CWD is on sys.path
        # and `import app` resolves; conftest also inserts the repo root.
        run: python -m pytest integration_tests/ -p no:cacheprovider -q

  # Migrations-from-scratch gate. Proves the database can be rebuilt from zero:
  # load the committed prod baseline, mark pre-baseline migrations as applied,
  # then apply any migrations added since. Catches a new migration that doesn't
  # cleanly apply on top of the real schema. NO-OP (green) until the baseline is
  # captured into migrations/baseline/000_baseline.sql — then it self-activates.
  schema-from-scratch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: procta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/procta
    steps:
      - uses: actions/checkout@v6

      - name: Check for committed baseline
        id: gate
        run: |
          if [ -f migrations/baseline/000_baseline.sql ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No migrations/baseline/000_baseline.sql yet — schema-from-scratch gate is a no-op. See migrations/baseline/README.md."
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install psql client + asyncpg
        if: steps.gate.outputs.present == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install asyncpg

      - name: Build schema from scratch (baseline + migrations)
        if: steps.gate.outputs.present == 'true'
        run: bash scripts/bootstrap_db_from_baseline.sh
