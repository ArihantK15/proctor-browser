name: Build & Release Electron App

# Triggered by pushing a version tag (e.g. `git tag v2.1.4 && git push --tags`).
# Each runner builds its own OS+arch target and publishes its binaries straight
# to the GitHub Release for the tag — dmg/zip/exe + .blockmap deltas.
#
# AUTO-UPDATE MANIFESTS:
#   - Windows: the single win job uploads latest.yml directly.
#   - macOS: the two arch jobs (both on macos-14) each emit their OWN per-arch
#     latest-mac.yml. They must NOT both upload it — the second would clobber
#     the first and half of all Macs would get "no update found". So each mac
#     job uploads ITS binaries but stashes its latest-mac.yml as a workflow
#     artifact; the `merge-mac-manifest` job then unions the two into one
#     manifest (scripts/merge-mac-latest.mjs) and uploads that single combined
#     latest-mac.yml to the release.
# WHY PER-ARCH JOBS: each arch bakes its own native wheels (numpy/opencv/
# onnxruntime/insightface) into python-runtime/<arch>/. BOTH run on macos-14
# (Apple Silicon): arm64 wheels bake natively; x64 wheels are CROSS-BUILT via
# Rosetta 2 (the x86_64 interpreter runs emulated, so its pip pulls genuine
# x86_64 wheels). We no longer use the macos-13 Intel runner — GitHub stopped
# scheduling it for this repo, which stalled every release in `queued`. The
# bake target is selected by PROCTA_BAKE_ARCH (= matrix.arch), see
# bundle-python.js#bakeMacTarget.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for debugging without creating a new tag
  workflow_dispatch:

permissions:
  contents: write  # needed so electron-builder can create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 wheels bake natively on Apple Silicon → macos-14 (M-series).
          - os: macos-14
            target: mac
            arch: arm64
          # x64 wheels are cross-built on the SAME Apple-Silicon runner via
          # Rosetta 2 (see the Install Rosetta step). The macos-13 Intel runner
          # is no longer scheduled for this repo and stalled every release.
          - os: macos-14
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Pin the minimum supported Node 22 line explicitly: Vite 8,
          # Puppeteer 25, and the React plugin require Node >=22.12.
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        # Strict — if package-lock.json is out of sync, fail loudly. The
        # earlier `|| npm install` fallback silently regenerated the lock
        # in CI which defeated the lockfile's purpose and let drift land
        # in release builds.
        run: npm ci

      # Build ONLY this matrix arch (--${{ matrix.arch }}). The per-arch
      # latest-mac.yml manifests are merged afterwards by the
      # merge-mac-manifest job — see the header comment.
      #
      # Signing path is gated on the CSC_LINK secret being non-empty.
      # When the secret is unset, an empty-string CSC_LINK gets handed
      # to electron-builder, which interprets it as a cert path and dies
      # with a misleading "<workdir> not a file" error AFTER fuses. So
      # we branch in the shell: with a cert we sign + notarize; without
      # we pass -c.mac.identity=- so electron-builder AD-HOC signs the
      # whole bundle in its own sign step — which runs AFTER the Electron
      # fuse flip, sealing the (fuse-mutated) framework correctly. The old
      # identity=null setting SKIPPED signing, leaving a stale pre-fuse
      # seal the kernel rejected at launch ("Code Signature Invalid /
      # Invalid Page" — the v2.3.9 crash). build/afterPack.js now signs
      # only the bundled Python interpreters, never the outer .app.
      #
      # Builds NEVER auto-publish here. The signature gate
      # (verify-macos-build.mjs) runs first; only if it passes does the
      # publish step upload — so a build that would crash on a student
      # Mac can never reach the auto-update channel.
      #
      # Download the relocatable python-build-standalone runtimes into
      # python-runtime/ so they get shipped via extraResources. Without
      # this the macOS app falls back to the user's system python3 (which
      # PEP 668 blocks from pip-installing the proctor packages).
      # x64 mac is cross-built on this arm64 runner: Rosetta 2 lets the
      # bundled x86_64 interpreter execute so its pip pulls x86_64 wheels.
      # Idempotent + no-op if already present; only needed on the x64 leg.
      - name: Install Rosetta 2 (mac x64 cross-build)
        if: matrix.target == 'mac' && matrix.arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Bundle Python runtime (macOS)
        if: matrix.target == 'mac'
        run: node bundle-python.js
        env:
          # Selects which python-runtime/<arch> gets the proctor wheels baked
          # in — see bundle-python.js#bakeMacTarget.
          PROCTA_BAKE_ARCH: ${{ matrix.arch }}

      # Bake the embeddable Python 3.11 + ALL proctor wheels into
      # resources/python/ so a fresh Windows install does ZERO first-launch
      # pip (the old behaviour: a 300-400 MB pip install on first run, behind
      # the setup window). Shipped via extraResources (package.json maps
      # resources/python → <resources>/python, where getBundledPython() looks).
      # bundle-python.js now FAILS the build if the bake can't import the full
      # package set, so a broken Windows installer can't reach the release.
      - name: Bundle Python runtime (Windows)
        if: matrix.target == 'win'
        run: node bundle-python.js

      # onnxruntime (face / gaze / object models) needs the MSVC runtime
      # (msvcp140.dll / vcruntime140_1.dll). Most end-user machines lack it,
      # so `import onnxruntime` fails with "DLL load failed …" and ALL AI
      # proctoring dies — students get stranded on gaze calibration. We embed
      # the official redistributable into Setup.exe (build/installer.nsh's
      # customInstall runs it silently). Load-bearing: a failed download must
      # FAIL the build rather than ship an installer that bricks proctoring.
      - name: Download Visual C++ runtime for the installer (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $url = 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
          $out = 'build/vc_redist.x64.exe'
          Write-Host "Downloading VC++ redistributable from $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $size = (Get-Item $out).Length
          Write-Host "Saved $out ($size bytes)"
          if ($size -lt 1000000) {
            throw "vc_redist.x64.exe is only $size bytes — download failed; refusing to ship an installer without the VC++ runtime"
          }

      # Bake the on-device speech models (Vosk en-IN + hi + Silero VAD) into
      # weights/ so they ship via extraResources (package.json maps weights/ →
      # <resources>/weights). This makes a fresh install fully OFFLINE — zero
      # first-launch model download on either OS (adds ~80 MB, accepted per the
      # privacy/offline goal). Uses only Python stdlib (urllib/zipfile), so the
      # runner's preinstalled Python is enough. PROCTA_WEIGHTS_DIR is left unset
      # → the script extracts into ROOT/weights, exactly what we want to bundle.
      - name: Bundle on-device audio models into weights/ (best-effort)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          echo "Using Python: $PY"
          # Best-effort: baking the Vosk/Silero models for an OFFLINE first
          # launch is an optimization, not load-bearing. download_audio_models.py
          # exits 1 on any single model hiccup (transient network / runner
          # flake), which previously failed the WHOLE release build. If it
          # fails, lib/python-manager.js downloads the models on first launch
          # instead (or degrades to the RMS-only voice path) — see the
          # "audio models bundled in app — skipping download" branch. So a
          # model miss must NOT block shipping the installer.
          "$PY" scripts/download_audio_models.py \
            || echo "::warning::audio model bundling failed — app will fetch them at first launch (RMS-only fallback meanwhile)"

      # Functional gate for the BUNDLED Windows proctor runtime — the symmetric
      # counterpart to verify-macos-build.mjs (Windows previously had none; a
      # build could ship completely dead proctoring with CI green). Runs
      # proctor.py --selftest on resources/python/python.exe and asserts:
      #   • exit 0  → onnxruntime AND uniface/RetinaFace import in the bundled
      #     interpreter (run_selftest returns 1 if either hard dep is missing)
      #   • a SELFTEST: line is emitted → the module imported to completion
      #   • no UnicodeEncodeError → proctor.py's UTF-8 stdio reconfigure holds
      # We force cp1252 stdout (PYTHONIOENCODING) to reproduce the Electron
      # pipe, and deliberately do NOT set PYTHONUTF8 — this tests proctor.py's
      # OWN protection, so removing the reconfigure fails the build.
      # CAVEAT: GitHub runners ship the MSVC runtime, so this cannot reproduce
      # the missing-VC++ case that bricked 2.3.26 — that is covered by the
      # installer-bundled vc_redist (build/installer.nsh) and ultimately a
      # clean-VM smoke test. This gate guards the runtime's health + the
      # cp1252 crash, not the end-user's missing-runtime machine.
      - name: Verify bundled Windows proctor runtime (selftest gate)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $py = "resources/python/python.exe"
          if (-not (Test-Path $py)) {
            throw "bundled Python missing at $py — the Windows bundle step produced no interpreter; the app would fall back to an unmanaged system Python"
          }
          $env:PYTHONIOENCODING = "cp1252"   # reproduce the Electron cp1252 pipe
          $out = & $py proctor.py --selftest 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($out -match "UnicodeEncodeError") {
            throw "proctor.py crashed on a non-ASCII status print under cp1252 — the UTF-8 stdio reconfigure regressed (the 2.3.27 Windows-calibration bug)"
          }
          if ($out -notmatch "SELFTEST:") {
            throw "no SELFTEST report emitted — proctor.py failed to import to completion in the bundled runtime"
          }
          if ($code -ne 0) {
            throw "proctor --selftest exit $code — a hard model dependency (onnxruntime / RetinaFace) failed to load in the bundled Windows runtime"
          }
          Write-Host "OK: bundled Windows runtime loads onnxruntime + RetinaFace and survives a cp1252 stdout"

      - name: Build (macOS — no publish; gated below)
        if: matrix.target == 'mac'
        shell: bash
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "Signing enabled — CSC_LINK provided."
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            export APPLE_ID="$APPLE_ID_SECRET"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_SECRET"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            npx electron-builder --mac --${{ matrix.arch }} --publish never
          else
            echo "No CSC_LINK secret — ad-hoc signing via identity=-."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # hardenedRuntime requires a real Developer ID signature; it is
            # incompatible with an ad-hoc sig and would make the app fail to
            # launch. Disable it on the no-cert path. (Cert branch keeps it on.)
            npx electron-builder --mac --${{ matrix.arch }} --publish never \
              -c.mac.identity=- \
              -c.mac.hardenedRuntime=false
          fi
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}

      # THE GATE. Inspects the packaged .app and fails the job if its code
      # signature is invalid — i.e. if it would SIGKILL on a student Mac.
      # This is the check that was missing when v2.3.9 shipped green.
      - name: Verify macOS signature (blocks publish on failure)
        if: matrix.target == 'mac'
        run: node scripts/verify-macos-build.mjs

      - name: Publish macOS release (only after the gate passes)
        if: matrix.target == 'mac' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Idempotent: create the release if the tag has none yet, then
          # upload this arch's binaries (dmg/zip + .blockmap deltas). The
          # latest-mac.yml manifest is uploaded by merge-mac-manifest, NOT
          # here (see NOTE below). --clobber lets a re-run overwrite a
          # partially-uploaded asset.
          gh release create "$TAG" --title "$TAG" --notes "Procta $TAG" 2>/dev/null || true
          # nullglob: an absent pattern expands to nothing instead of being
          # passed to gh literally (which errors "no matches found").
          #
          # NOTE: latest-mac.yml is DELIBERATELY excluded here. Each arch job
          # would upload its own single-arch manifest and clobber the other's,
          # breaking auto-update for half of all Macs. The merge-mac-manifest
          # job uploads the combined manifest instead (see below).
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then echo "✗ no macOS artifacts to upload"; exit 1; fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stash this arch's latest-mac.yml for the merge job. Runs on every
      # trigger (not just tags) so workflow_dispatch debugging produces it too;
      # the merge job is what gates on the tag. if-no-files-found=error catches
      # a build that silently failed to emit a manifest.
      - name: Stash macOS manifest for merge
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-${{ matrix.arch }}
          path: dist/latest-mac.yml
          if-no-files-found: error

      # Windows: unsigned EXE only triggers SmartScreen (it does not crash),
      # so there is no signature gate to fail — but we still build first,
      # confirm the artifacts exist, then publish, for parity with macOS.
      - name: Build (Windows — no publish; verified below)
        if: matrix.target == 'win'
        shell: bash
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            echo "Signing enabled — CSC_LINK provided."
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
            npx electron-builder --win --x64 --publish never
          else
            echo "No CSC_LINK secret — building UNSIGNED."
            npx electron-builder --win --x64 --publish never
          fi
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify Windows artifacts exist
        if: matrix.target == 'win'
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          exe=(dist/*.exe); yml=(dist/latest.yml); bmap=(dist/*.exe.blockmap)
          if [ ${#exe[@]} -eq 0 ]; then echo "✗ no installer .exe produced"; exit 1; fi
          if [ ! -f "${yml[0]}" ]; then echo "✗ latest.yml (auto-update manifest) missing"; exit 1; fi
          # differentialPackage:true must emit a .blockmap — it's what lets
          # auto-update download only changed blocks instead of the full
          # (now ~400MB, Python-bundled) installer. Missing blockmap = silent
          # regression back to full re-downloads.
          if [ ${#bmap[@]} -eq 0 ]; then echo "✗ no .blockmap produced (differential updates broken)"; exit 1; fi
          # A truncated/empty installer is a silent release-breaker.
          sz=$(stat -c%s "${exe[0]}" 2>/dev/null || stat -f%z "${exe[0]}")
          if [ "$sz" -lt 10000000 ]; then echo "✗ installer suspiciously small ($sz bytes)"; exit 1; fi
          echo "✓ Windows artifacts present (${exe[0]}, $sz bytes, blockmap ${bmap[0]})"

      - name: Publish Windows release (only after verification)
        if: matrix.target == 'win' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --notes "Procta $TAG" 2>/dev/null || true
          # NSIS is built with differentialPackage:true → a .blockmap is
          # produced and uploaded so electron-updater can do delta downloads.
          # nullglob drops any unmatched pattern so it isn't passed to gh
          # literally (which failed the 2.3.17 run with "no matches found").
          shopt -s nullglob
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "✗ no Windows artifacts to upload"; exit 1; fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show dist contents
        shell: bash
        run: ls -lh dist/ || true

  # Combine the two per-arch latest-mac.yml manifests into the single one
  # electron-updater reads. Runs only on a tag (no manifest to publish on a
  # dispatch debug run) and only after BOTH mac jobs succeed. If either arch
  # job failed, `needs: build` keeps this from shipping a half-manifest.
  merge-mac-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to upload the merged manifest to the release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      # The merge script needs js-yaml only. --ignore-scripts avoids the
      # electron postinstall binary download (~100 MB) we don't need here.
      - name: Install merge-script dependency (js-yaml)
        run: npm install --no-save --ignore-scripts js-yaml@4

      - name: Download arm64 manifest
        uses: actions/download-artifact@v4
        with:
          name: mac-manifest-arm64
          path: manifests/arm64

      - name: Download x64 manifest
        uses: actions/download-artifact@v4
        with:
          name: mac-manifest-x64
          path: manifests/x64

      - name: Merge per-arch manifests into one latest-mac.yml
        run: |
          node scripts/merge-mac-latest.mjs \
            manifests/arm64/latest-mac.yml \
            manifests/x64/latest-mac.yml \
            -o latest-mac.yml
          echo "--- merged latest-mac.yml ---"
          cat latest-mac.yml

      - name: Upload combined latest-mac.yml to the release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" latest-mac.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
