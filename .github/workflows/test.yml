name: Tests

# Run the Python test suite on every push and PR. The Electron build
# workflow only fires on version tags, which means main could rot for
# weeks before CI noticed. This job catches regressions immediately.
#
# Tests use a stubbed Supabase client (see tests/conftest.py) so we
# don't need real DB credentials in CI — that's also why this job is
# safe to run on PRs from forks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          # 22 — puppeteer 25 (used by website postbuild prerender)
          # requires Node >=22.12; on 20 it warns and may fail at runtime.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/dashboard-ui/package-lock.json
            app/student-ui/package-lock.json
            website/package-lock.json

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-asyncio pytest-cov

      - name: Compile-check Python sources
        # Catches syntax errors before pytest tries to collect — gives
        # a much clearer failure message than the test runner would.
        run: |
          python -c "
          import ast, os, sys
          bad = []
          for root, _, files in os.walk('app'):
              if '__pycache__' in root: continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try: ast.parse(open(p).read())
                      except SyntaxError as e: bad.append(f'{p}:{e.lineno}: {e.msg}')
          if bad:
              for b in bad: print(b)
              sys.exit(1)
          print('All Python files parse cleanly.')
          "

      - name: Install + lint Electron dependencies
        run: |
          npm ci
          npm run lint
          npm audit --audit-level=low

      - name: Build dashboard
        run: |
          cd app/dashboard-ui
          npm ci
          npm audit --audit-level=low
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Build student UI
        run: |
          cd app/student-ui
          npm ci
          npm audit --audit-level=low
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Build marketing site
        run: |
          cd website
          npm ci
          npm audit --audit-level=low
          npm run lint
          npm run build

      - name: Run pytest
        env:
          # Stub values — tests/conftest.py replaces the real client
          # before any test imports app.main. These just satisfy the
          # `os.environ[...]` reads at import time.
          # Must match the value tests/conftest.py sets via setdefault.
          # Tests like test_hybrid_oauth_..._keeps_supabase_provider
          # assert netloc == "fake.supabase.co"; setting a different
          # URL here overrides conftest's setdefault and breaks them.
          SUPABASE_URL: "https://fake.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "stub"
          # Must be >= 32 chars — app/constants.py enforces this when
          # ENV is unset (which CI is, by design — fail-closed posture).
          # Previous value `stub-jwt-secret-please-rotate` was 29 chars,
          # tripping the guard and crashing pytest collection.
          SUPABASE_JWT_SECRET: "stub-jwt-secret-please-rotate-ci-test-only-do-not-use-anywhere"
          ADMIN_PASSWORD: "stub-admin-password"
        # `--ignore=tests/browser`: the browser tests use Playwright +
        #   real Chromium, which we don't install in this lightweight
        #   CI job. Browser tests get their own workflow if/when we
        #   wire that up.
        # `--ignore=tests/test_proctor_e2e.py --ignore=tests/test_proctor_features.py`:
        #   proctor tests need cv2/numpy/ultralytics/insightface which
        #   are heavy, GPU-optional deps not needed for the server API.
        #   They are run locally before commits.
        # No `-x`: a single transient flake shouldn't mask the rest of
        #   the suite. We want to see ALL failures on each push so a
        #   regression in one area doesn't hide one in another.
        run: |
          pytest tests/ \
            --ignore=tests/browser \
            --ignore=tests/test_proctor_e2e.py \
            --ignore=tests/test_proctor_features.py \
            --cov=app --cov-report=xml --cov-report=term \
            -v --tb=short

      # Coverage upload — uses Codecov's tokenless OIDC flow for public
      # repos. No CODECOV_TOKEN secret required. Failures here are
      # non-fatal: a coverage upload glitch must not red-x the test
      # job that already passed.
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: pytest
          fail_ci_if_error: false

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pytest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t proctor-api:ci .

      - name: Start Redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --save ""

      - name: Start API container
        run: |
          docker run -d --name api --network host \
            -e SUPABASE_URL=https://fake.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=stub \
            -e SUPABASE_JWT_SECRET=stub-jwt-secret-please-rotate-ci-test-only-do-not-use-anywhere \
            -e ADMIN_PASSWORD=stub-admin-password \
            -e REDIS_URL=redis://localhost:6379 \
            -e CORS_ORIGINS=http://localhost:8000 \
            -e EMAIL_PROVIDER=noop \
            -e EMAIL_FROM=test@procta.net \
            -e SUPABASE_SKIP_STARTUP_CHECK=1 \
            -e SCREENSHOTS_DIR=/tmp/proctor-screenshots \
            proctor-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            sleep 3
          done
          echo "API failed to start"
          docker logs api
          exit 1

      - name: Run smoke test
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/loadtest:/scripts:ro" \
            -e TARGET=http://localhost:8000 \
            grafana/k6:0.54.0 run /scripts/smoke.js

      - name: Clean up
        if: always()
        run: docker rm -f api redis || true

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST
        # Direct CLI invocation rather than semgrep/semgrep-action@v1
        # so we can pass --exclude-rule and --exclude reliably. The
        # action's inline nosemgrep handling proved unreliable.
        #
        # Excluded RULES (false positives in production code — see
        # inline `# nosemgrep:` comments at each site for rationale):
        #   asyncpg-sqli            — $N parameterized queries with
        #                             literal SQL constants in VALUES
        #   jwt-python-exposed-data — generic RS256 signer for LTI
        #                             AGS; internal callers only
        #   missing-integrity       — Cloudflare Turnstile rolls
        #                             api.js content; SRI impossible
        #
        # Excluded PATHS:
        #   tests/    — test code deliberately decodes JWTs without
        #               verification (to inspect token bodies), asserts
        #               plain websocket URLs, and uses importlib for
        #               introspection. Not production code paths.
        #   .github/  — workflow YAML is CI config, not app code.
        #               (Also, Semgrep flagged the previous version
        #               of this very comment because the literal
        #               string `ws` + `://` matched the websocket rule.)
        run: |
          python -m pip install --quiet "semgrep>=1.76.0"
          semgrep --config auto \
            --error \
            --exclude tests \
            --exclude .github \
            --exclude-rule "python.lang.security.audit.sqli.asyncpg-sqli.asyncpg-sqli" \
            --exclude-rule "python.jwt.security.audit.jwt-exposed-data.jwt-python-exposed-data" \
            --exclude-rule "html.security.audit.missing-integrity.missing-integrity" \
            .

      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            aquasec/trivy:0.50.1 fs \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            /workspace
