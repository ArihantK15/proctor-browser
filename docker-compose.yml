services:
  api:
    # Local dev: build from Dockerfile.  In CI deploy the `image:` line
    # takes precedence (GHCR tag pushed by the deploy workflow).
    build: .
    # image: ghcr.io/${GITHUB_REPOSITORY:-user/repo}-api:main
    container_name: proctor-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - LOADTEST_SECRET=${LOADTEST_SECRET:-}
      - GIT_SHA=${GIT_SHA:-local}
      - IMAGE_TAG=${IMAGE_TAG:-local}
      - APP_VERSION=${APP_VERSION:-dev}
      # 4 uvicorn workers on a 4-vCPU KVM. CPU limit of 3.0 (above)
      # is a soft cap; under burst load all 4 can run because each
      # request is mostly I/O-bound (DB + Redis). Previous default
      # was 2 → API CPU peaked at ~170% (1.7 cores) under load,
      # leaving 2 cores starved. With 4 we hit ~250-300% during the
      # submit wave, properly using the box.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - UVICORN_LIMIT_CONCURRENCY=${UVICORN_LIMIT_CONCURRENCY:-}
    depends_on:
      - redis
    volumes:
      - ./screenshots:/app/screenshots
      - ./logs:/data/logs
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-4g}
          cpus: "${API_CPU_LIMIT:-3.0}"
    memswap_limit: ${API_MEMSWAP_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: proctor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./app/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-512m}
          cpus: "${CADDY_CPU_LIMIT:-1.0}"
    memswap_limit: ${CADDY_MEMSWAP_LIMIT:-768m}
    depends_on:
      # Wait for the API healthcheck to pass before Caddy starts —
      # otherwise the proxy boots first and serves 502 to anyone
      # hitting the site during the ~15 s API warm-up after deploy.
      api:
        condition: service_healthy
  worker:
    build: .
    entrypoint: python worker.py
    # container_name removed — blocks `docker compose up --scale worker=N`.
    # Docker will auto-name as `proctor-browser-worker-1`, `-2`, etc.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - RQ_ENABLED=1
      - GIT_SHA=${GIT_SHA:-local}
      - IMAGE_TAG=${IMAGE_TAG:-local}
      - APP_VERSION=${APP_VERSION:-dev}
    depends_on:
      - redis
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          # Sized so 20 replicas fit on a 4-vCPU / 16-GB KVM:
          #   20 × 256 MB = 5.1 GB total — well under 16 GB
          #   20 × 0.5 CPU cap = 10 CPU oversubscribed on 4 cores, fine
          #   because scoring workers are I/O-bound (DB queries dominate).
          # Observed actual per-worker usage at 3 workers: ~89 MB / 0.5 CPU.
          memory: ${WORKER_MEMORY_LIMIT:-256m}
          cpus: "${WORKER_CPU_LIMIT:-0.5}"
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-384m}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  autosave-worker:
    build: .
    entrypoint: python worker.py
    # container_name removed for the same reason as `worker` —
    # blocks `docker compose --scale autosave-worker=N`. Docker
    # auto-names as proctor-browser-autosave-worker-1, -2, etc.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - RQ_ENABLED=1
      - RQ_QUEUE=autosave
      - GIT_SHA=${GIT_SHA:-local}
      - IMAGE_TAG=${IMAGE_TAG:-local}
      - APP_VERSION=${APP_VERSION:-dev}
    depends_on:
      - redis
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: ${AUTOSAVE_WORKER_MEMORY_LIMIT:-512m}
          cpus: "${AUTOSAVE_WORKER_CPU_LIMIT:-0.75}"
    memswap_limit: ${AUTOSAVE_WORKER_MEMSWAP_LIMIT:-768m}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  redis:
    image: redis:7-alpine
    container_name: proctor-redis
    # maxmemory bumped 64mb → 256mb (2026-05-22) — under 3000 VU
    # exam load the RQ scoring queue can hit 2000+ jobs in flight
    # at ~5KB each = ~10MB just for the queue, plus session caches.
    # The container has memory_limit=256mb (below) so we set this
    # equal — Redis evicts before OOM-killing the container. Policy
    # allkeys-lru is safe because we use Redis purely as cache and
    # transient queue; persistent state is in Postgres.
    command: redis-server --maxmemory 240mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-384m}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # pgbouncer — transaction-pooling connection multiplexer in front
  # of postgres. The app and workers connect to pgbouncer:6432
  # instead of postgres:5432. pgbouncer holds a small pool of REAL
  # backends and lets thousands of logical client connections share
  # them. This is the lever that lets us scale past 16 workers and
  # 4000 VUs without running into postgres's max_connections=200 cap.
  #
  # Why edoburu/pgbouncer over building our own:
  #   - Single env-var config (DATABASES_HOST etc.), no userlist.txt
  #     to babysit
  #   - Generates userlist on boot from DATABASES_PASSWORD using the
  #     same auth_type Postgres expects (scram-sha-256 on PG 16)
  #   - 30 MB image, no runtime deps
  #
  # Pool mode: TRANSACTION
  #   - Each app SQL transaction grabs a real backend, releases it on
  #     COMMIT/ROLLBACK. Many app connections share few backends.
  #   - Breaks: prepared statements (handled — asyncpg sees
  #     DATABASE_USE_PGBOUNCER=1 and sets statement_cache_size=0),
  #     LISTEN/NOTIFY (we don't use it), session SET LOCAL (we don't
  #     use it), advisory locks (we don't use them).
  #
  # Cutover: set in .env on the KVM:
  #   DATABASE_URL=postgresql://procta:<urlencoded-pw>@pgbouncer:6432/procta
  #   DATABASE_USE_PGBOUNCER=1
  # Then `docker compose up -d` — pgbouncer comes up, app connects to
  # it. Rollback is just changing the URL back to postgres:5432.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: proctor-pgbouncer
    # Same profile as postgres — if you're on the Supabase legacy
    # path (no local postgres), pgbouncer doesn't make sense either.
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-procta}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-procta-local-dev-change-me}
      - DB_NAME=${POSTGRES_DB:-procta}
      # Use the standard pgbouncer port 6432 (not the edoburu default
      # of 5432) so DATABASE_URL clearly says pgbouncer:6432 and
      # postgres:5432, no ambiguity.
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      # Real Postgres backends pgbouncer is allowed to open. Setting
      # this to 25 means up to 25 actual connections to postgres —
      # well under max_connections=200 and leaves room for ofelia
      # backup jobs + admin sessions.
      - DEFAULT_POOL_SIZE=25
      # Keep 10 backends warm. First-request latency drops because
      # we don't wait for a TCP+TLS+SCRAM handshake.
      - MIN_POOL_SIZE=10
      # Burst capacity — 5 extra backends pgbouncer can briefly open
      # if DEFAULT_POOL_SIZE is exhausted and a client is waiting.
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      # How many app-side "client" connections we accept. 4000 is
      # comfortably above our 4 uvicorn × 40 + 16 workers × 40 + 2
      # autosave × 40 = ~880 worst-case client pool slot count.
      - MAX_CLIENT_CONN=4000
      # Reset connection state between transactions to avoid leaking
      # any session-scoped state from one app request to the next.
      - SERVER_RESET_QUERY=DISCARD ALL
      - AUTH_TYPE=scram-sha-256
      # Allow the procta user to query pgbouncer's special "pgbouncer"
      # admin database (SHOW POOLS, SHOW STATS, SHOW CLIENTS, RECONNECT,
      # etc). Without one of these, `make pgbouncer-stats` fails with
      # "pgbouncer: not allowed".
      - ADMIN_USERS=${POSTGRES_USER:-procta}
      - STATS_USERS=${POSTGRES_USER:-procta}
      # Behind a private Docker network — no need for client SSL
      - CLIENT_TLS_SSLMODE=disable
      - SERVER_TLS_SSLMODE=disable
      # Reasonable timeouts for the exam workload
      - SERVER_IDLE_TIMEOUT=600
      - SERVER_LIFETIME=3600
      - QUERY_TIMEOUT=30
      - CLIENT_IDLE_TIMEOUT=600
      # Logging
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - LOG_POOLER_ERRORS=1
    expose:
      - "6432"
    depends_on:
      postgres:
        condition: service_healthy
    # pgbouncer's alpine base image does NOT include pg_isready or
    # psql. Use busybox `nc -z` for a TCP-level liveness probe.
    # This only confirms the port is listening (good enough for
    # "container is up" — actual SQL reachability is checked by the
    # app's first asyncpg connection, which will retry on failure).
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${PGBOUNCER_MEMORY_LIMIT:-128m}
          cpus: "${PGBOUNCER_CPU_LIMIT:-0.5}"
    memswap_limit: ${PGBOUNCER_MEMSWAP_LIMIT:-192m}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:16-alpine
    container_name: proctor-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    # Tuned for KVM 4 (4 vCPU, 16 GB RAM, 6 GB cap on this container)
    # at 3000+ VU exam load. Defaults that ship with postgres:16-alpine
    # are sized for a 1 GB toy box, which leaves a huge amount of
    # cache + planner accuracy on the table.
    #
    #   shared_buffers=2GB         — 1/3 of the 6 GB cap; standard
    #                                Postgres-tuning advice
    #   effective_cache_size=4GB   — tells planner the OS likely has
    #                                4 GB of free filesystem cache
    #                                available (it does — KVM 4 has
    #                                16 GB total, ~8 GB free during
    #                                load tests)
    #   work_mem=16MB              — per-sort buffer; default 4 MB is
    #                                way too small for the JOINs in
    #                                scoring
    #   max_connections=200        — already raised manually; pin in
    #                                config so a `docker compose down`
    #                                doesn't reset it
    #   max_worker_processes=8     — parallel query workers
    #   random_page_cost=1.1       — SSD-style cost (vs HDD default 4)
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=4GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=2
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-procta}
      - POSTGRES_USER=${POSTGRES_USER:-procta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-procta-local-dev-change-me}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-6g}
          cpus: "${POSTGRES_CPU_LIMIT:-3.0}"
    memswap_limit: ${POSTGRES_MEMSWAP_LIMIT:-8g}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # ofelia (the scheduler service below) reads these labels to know
    # when to run a job inside this container. @daily = 00:00 UTC =
    # 05:30 IST, before normal customer traffic. The job runs pg_dump
    # to /backups (host-mounted) with custom-format compression, then
    # prunes anything older than 14 days. Matches scripts/backup_postgres.sh
    # so the manual + scheduled flows produce identical artefacts.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.daily-backup.schedule: "@daily"
      ofelia.job-exec.daily-backup.command: >
        sh -c 'pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
        --format=custom --no-owner --no-privileges
        > /backups/procta-$$(date -u +%Y%m%dT%H%M%SZ).dump
        && find /backups -name "procta-*.dump" -type f -mtime +14 -delete'

  ofelia:
    # Lightweight cron-for-docker (~3 MB image). Reads schedule from the
    # `ofelia.*` labels on the postgres service and exec's the configured
    # command inside that container — no extra cron daemon to maintain
    # on the host. Read-only docker.sock mount is the standard ofelia
    # pattern; the daemon only needs `exec` capability into other
    # containers, never `run` or `delete`.
    image: mcuadros/ofelia:latest
    container_name: proctor-ofelia
    profiles: ["postgres"]
    restart: unless-stopped
    depends_on:
      - postgres
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
