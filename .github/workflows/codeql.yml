name: CodeQL

# GitHub's native SAST. Complements Semgrep (different rule set,
# different SARIF surface that lands in the Security tab). Free for
# public repos.
#
# We run on push to main, on PRs to main, and weekly to catch new
# rule packs that flag previously-passing code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:00 IST = 01:30 UTC. Stagger with Dependabot's 06:00
    # IST window so we don't queue up too many runs at once.
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # `javascript` covers TS too. Python is the main backend
        # surface; JS covers Electron client + React dashboards +
        # marketing site.
        language: [python, javascript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 'security-extended' adds rules beyond the default that are
          # still high-precision (low false-positive rate).
          queries: security-extended
          # Custom rule filters + paths-ignore live in this config so
          # generated bundles and verified false-positive rules are
          # excluded centrally.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
