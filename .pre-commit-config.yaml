# Pre-commit hooks. Install once per machine:
#   pip install pre-commit
#   pre-commit install
#
# The primary purpose of this file is gitleaks — block secrets from
# being committed to git even by accident. .env is already gitignored,
# but a distracted `git add -A` from a directory with an `api_keys.txt`
# laying around would still let things through without this.
#
# Hooks run on `git commit`; bypass for one commit with `--no-verify`
# (don't make a habit of it). GitHub push protection is the
# server-side backstop if the local hook is bypassed.

repos:
  # ── Secret scanning ─────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        # We let .env.example through because it lists placeholder
        # values that match high-entropy patterns but are not real
        # secrets. Real .env files are blocked by .gitignore.
        exclude: |
          (?x)^(
            \.env\.example$|
            app/student-react/assets/.*\.js$|
            app/dashboard-react/assets/.*\.js$|
            app/static/dashboard-react/assets/.*\.js$|
            app/static/student-react/assets/.*\.js$
          )$

  # ── Generic hygiene ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.(md|svg|onnx)$
      - id: check-yaml
        args: [--unsafe]   # GitHub Actions uses custom !!tags
      - id: check-json
        exclude: tsconfig.*\.json$  # comments allowed in TS configs
      - id: check-added-large-files
        args: [--maxkb=16384]
        # 16 MB cap — raised from 8 MB to admit the bundled object-detection
        # model weights/yolov8n.onnx (~12 MB), required after the ultralytics/
        # torch → onnxruntime migration (precedent: resnet18_gaze.onnx ~45 MB
        # already lives in git, no LFS yet). Still flags genuinely accidental
        # large binaries; anything bigger really should go through Git LFS.
      - id: check-merge-conflict
      - id: detect-private-key

# Don't run on the built React bundles (they're generated by Vite +
# minified, so trailing-whitespace and EOF rules add noise without
# value).
exclude: |
  (?x)^(
    app/static/dashboard-react/assets/.*|
    app/static/student-react/assets/.*|
    weights/.*|
    dist/.*|
    build/.*|
    node_modules/.*
  )$
