name: Deploy API

# Deploys the API to the KVM production server after tests pass.
# Strategy: SSH in, git pull, docker compose build + up (no GHCR registry
# needed — the server builds from source directly, keeping things simple).
#
# Required GitHub secrets:
#   KVM_HOST        — server IP or hostname
#   KVM_USER        — SSH user (e.g. root)
#   KVM_SSH_KEY     — private key whose public key is in authorized_keys

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  security-events: write

jobs:
  # Re-run the test suite to gate the deploy
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only deploy from main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy via SSH (git pull + docker build)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          # 15-minute timeout for Docker build on a 4-core KVM
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /root/proctor-browser || { echo "ERROR: /root/proctor-browser not found — clone the repo first"; exit 1; }

            echo "==> git pull main"
            git fetch origin
            git reset --hard origin/main

            echo "==> building containers (sha=${{ github.sha }})"
            export GIT_SHA="${{ github.sha }}"
            export APP_VERSION="${{ github.ref_name }}"
            export IMAGE_TAG="local"
            docker compose build api worker autosave-worker

            echo "==> restarting api + workers"
            docker compose up -d --no-deps api worker autosave-worker

            echo "==> ensuring caddy is running + reloading Caddyfile"
            docker compose up -d caddy
            # `docker compose up -d caddy` is a no-op if the container is
            # already running and the compose config hasn't changed — so
            # Caddyfile edits stay invisible until someone manually
            # `docker compose restart caddy`s. Reload the live config in
            # place every deploy so Caddyfile changes (routing, headers)
            # actually take effect.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose restart caddy

            echo "==> waiting for API healthcheck (max 90s)..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' proctor-api 2>/dev/null || echo unknown)
              if [ "$STATUS" = "healthy" ]; then
                echo "==> API healthy after $((i * 5))s"
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: API did not become healthy within 90s"
            docker compose logs --tail=50 api
            exit 1

      - name: Prune old images
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER }}
          key: ${{ secrets.KVM_SSH_KEY }}
          script: |
            docker image prune -f --filter "until=24h" 2>/dev/null || true
