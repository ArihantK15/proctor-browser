name: Deploy API

# Deploys the API to the KVM production server via a self-hosted
# GitHub Actions runner installed on the VM itself. The runner connects
# OUTBOUND to GitHub (always works) and executes the deploy script in
# place — no inbound SSH dependency, eliminating the dial-tcp timeout
# class of failures we hit with the previous appleboy/ssh-action path.
#
# The runner is registered against this repo and runs under root in
# /root/actions-runner as a systemd service. It executes inside the
# same VM that hosts the docker compose stack, so the deploy script
# just cd's into /root/proctor-browser (the existing checkout that
# docker-compose.yml references) and runs the same commands a human
# operator would.
#
# Tests still run on a clean GitHub-hosted ubuntu-latest runner so
# they don't pollute prod state.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Serialize prod deploys — never run two at once. Six deploys overlapping (from
# merging 6 PRs back-to-back) restarted the origin repeatedly and produced a
# Cloudflare 525 (origin TLS handshake failing mid-restart). Queue instead;
# cancel-in-progress:false so a running deploy ALWAYS finishes cleanly — a
# half-cancelled `docker compose up` could leave the origin in a broken state.
concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  # Re-run the test suite on a clean cloud runner to gate the deploy.
  tests:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: tests
    runs-on: self-hosted
    timeout-minutes: 20
    # Only deploy from main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy (git pull + docker build + healthcheck)
        env:
          GIT_SHA: ${{ github.sha }}
          APP_VERSION: ${{ github.ref_name }}
          IMAGE_TAG: local
        run: |
          set -euo pipefail
          cd /root/proctor-browser

          # ── Rollback capture ──────────────────────────────────────────
          # Record the image each service is running on RIGHT NOW (ref + id)
          # so a failed healthcheck can revert to the last-known-good image
          # instead of leaving prod on a broken build. Name-agnostic: resolves
          # the running container per compose service (worker/autosave have no
          # fixed container_name). All best-effort — capture must never fail
          # the deploy, so every step is guarded.
          capture_img() {            # echoes "ref|id" for service $1, or nothing
            local cid ref id
            cid=$(docker compose --compatibility ps -q "$1" 2>/dev/null | head -1 || true)
            [ -z "$cid" ] && return 0
            ref=$(docker inspect --format='{{.Config.Image}}' "$cid" 2>/dev/null || true)
            id=$(docker inspect  --format='{{.Image}}'        "$cid" 2>/dev/null || true)
            [ -n "$ref" ] && [ -n "$id" ] && echo "${ref}|${id}"
            return 0
          }
          rollback_one() {           # retag old image id back onto its ref ($1="ref|id")
            local ref="${1%%|*}" id="${1##*|}"
            { [ -z "$ref" ] || [ -z "$id" ] || [ "$ref" = "$1" ]; } && return 0
            docker tag "$id" "$ref" 2>/dev/null || true
          }
          API_PREV=$(capture_img api || true)
          WORKER_PREV=$(capture_img worker || true)
          AUTOSAVE_PREV=$(capture_img autosave-worker || true)
          echo "==> rollback points: api='${API_PREV:-none}' worker='${WORKER_PREV:-none}' autosave='${AUTOSAVE_PREV:-none}'"

          echo "==> git fetch + reset to ${GIT_SHA}"
          git fetch origin
          git reset --hard origin/main

          echo "==> building containers"
          docker compose --compatibility build api worker autosave-worker

          echo "==> preflight migrations"
          docker compose --compatibility run --rm --no-deps --entrypoint sh api -c \
            'if [ "${DATABASE_BACKEND:-supabase}" = "postgres" ]; then python scripts/run_postgres_migrations.py; else python scripts/run_migrations.py; fi'

          echo "==> restarting api + workers"
          docker compose --compatibility up -d --no-deps api worker autosave-worker

          echo "==> ensuring caddy is running + applying Caddyfile"
          docker compose --compatibility up -d caddy
          docker compose --compatibility restart caddy
          sleep 2

          echo "==> waiting for API healthcheck (max 180s)..."
          for i in $(seq 1 36); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' proctor-api 2>/dev/null || echo unknown)
            if [ "$STATUS" = "healthy" ]; then
              echo "==> API healthy after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done

          # ── Automated rollback ────────────────────────────────────────
          # New build never went healthy. Revert api+workers to their previous
          # images and bring them back up so prod stays on the last-known-good
          # release. Migrations are expand-contract (additive only — see
          # migrations/MIGRATIONS.md), so rolling code back over an already-
          # applied migration is safe. We still exit non-zero: the *release*
          # failed and must be visible, even though prod was rescued.
          echo "ERROR: API did not become healthy within 180s — rolling back"
          docker compose --compatibility logs --tail=80 api || true
          if [ -n "${API_PREV}" ]; then
            rollback_one "${API_PREV}"
            rollback_one "${WORKER_PREV}"
            rollback_one "${AUTOSAVE_PREV}"
            docker compose --compatibility up -d --no-deps api worker autosave-worker || true
            echo "==> reverted to previous images; verifying healthcheck (max 120s)..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' proctor-api 2>/dev/null || echo unknown)
              if [ "$STATUS" = "healthy" ]; then
                echo "==> ROLLBACK OK: prod healthy on previous image after $((i * 5))s"
                break
              fi
              sleep 5
            done
          else
            echo "WARNING: no previous image captured (first deploy?) — cannot auto-rollback"
          fi
          exit 1

      - name: Prune old images
        # Only on a clean deploy — never prune after a failed/rolled-back run,
        # or we could delete the rollback image we just reverted onto.
        if: success()
        continue-on-error: true
        run: docker image prune -f --filter "until=24h" 2>/dev/null || true
