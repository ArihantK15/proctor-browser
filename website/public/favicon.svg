<!--
  Procta favicon — the negative-space "P" mark from logo.svg, centered on a
  64×64 canvas with a navy rounded-square background so it renders cleanly
  at 16×16 in browser tabs and 48×48+ in Google SERPs.

  Used in two contexts:
    1. /favicon.svg          — modern browsers (Chrome, Firefox, Safari, Edge)
    2. Source for PNG renders at 16/32/48/180/192/512 (see scripts/gen_favicons.py)

  Design language matches app/static/logo.svg (negative-space "P" on an
  accent-blue P, navy chip) so the brand mark is identical wherever it
  appears — browser tab, Google search snippet, iOS home-screen, Windows
  Start tile, OG image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand-navy rounded-square background. Gives the mark enough contrast
       at 16px against light or dark browser chrome. -->
  <rect width="64" height="64" rx="12.75" fill="#0F172A"/>

  <!-- Negative-space "P", native canvas is 512x512, scale(0.125) maps it
       directly onto this 64x64 viewBox. -->
  <path d="M160 120H320C364.183 120 400 155.817 400 200V200C400 244.183 364.183 280 320 280H220V400H160V120ZM220 180V220H320C331.046 220 340 211.046 340 200V200C340 188.954 331.046 180 320 180H220Z"
        fill="#2563EB" transform="scale(0.125)"/>
</svg>
