name: Tests

# Run the Python test suite on every push and PR. The Electron build
# workflow only fires on version tags, which means main could rot for
# weeks before CI noticed. This job catches regressions immediately.
#
# Tests use a stubbed Supabase client (see tests/conftest.py) so we
# don't need real DB credentials in CI — that's also why this job is
# safe to run on PRs from forks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/dashboard-ui/package-lock.json
            website/package-lock.json

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Compile-check Python sources
        # Catches syntax errors before pytest tries to collect — gives
        # a much clearer failure message than the test runner would.
        run: |
          python -c "
          import ast, os, sys
          bad = []
          for root, _, files in os.walk('app'):
              if '__pycache__' in root: continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try: ast.parse(open(p).read())
                      except SyntaxError as e: bad.append(f'{p}:{e.lineno}: {e.msg}')
          if bad:
              for b in bad: print(b)
              sys.exit(1)
          print('All Python files parse cleanly.')
          "

      - name: Audit Electron dependencies
        run: npm audit --audit-level=low

      - name: Build dashboard
        run: |
          cd app/dashboard-ui
          npm ci
          npm audit --audit-level=low
          npm run build

      - name: Build marketing site
        run: |
          cd website
          npm ci
          npm audit --audit-level=low
          npm run build

      - name: Run pytest
        env:
          # Stub values — tests/conftest.py replaces the real client
          # before any test imports app.main. These just satisfy the
          # `os.environ[...]` reads at import time.
          SUPABASE_URL: "http://stub"
          SUPABASE_SERVICE_ROLE_KEY: "stub"
          SUPABASE_JWT_SECRET: "stub-jwt-secret-please-rotate"
          ADMIN_PASSWORD: "stub-admin-password"
        # `--ignore=tests/browser`: the browser tests use Playwright +
        #   real Chromium, which we don't install in this lightweight
        #   CI job. Browser tests get their own workflow if/when we
        #   wire that up.
        # `--ignore=tests/test_proctor_e2e.py --ignore=tests/test_proctor_features.py`:
        #   proctor tests need cv2/numpy/ultralytics/insightface which
        #   are heavy, GPU-optional deps not needed for the server API.
        #   They are run locally before commits.
        # No `-x`: a single transient flake shouldn't mask the rest of
        #   the suite. We want to see ALL failures on each push so a
        #   regression in one area doesn't hide one in another.
        run: pytest tests/ --ignore=tests/browser --ignore=tests/test_proctor_e2e.py --ignore=tests/test_proctor_features.py -v --tb=short

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t proctor-api:ci .

      - name: Start Redis
        run: docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --save ""

      - name: Start API container
        run: |
          docker run -d --name api --network host \
            -e SUPABASE_URL=http://stub \
            -e SUPABASE_SERVICE_ROLE_KEY=stub \
            -e SUPABASE_JWT_SECRET=stub-jwt-secret-please-rotate \
            -e ADMIN_PASSWORD=stub-admin-password \
            -e REDIS_URL=redis://localhost:6379 \
            -e CORS_ORIGINS=http://localhost:8000 \
            -e EMAIL_PROVIDER=noop \
            -e EMAIL_FROM=test@procta.net \
            -e SUPABASE_SKIP_STARTUP_CHECK=1 \
            proctor-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            sleep 3
          done
          echo "API failed to start"
          docker logs api
          exit 1

      - name: Run smoke test
        run: |
          docker run --rm --network host \
            -e TARGET=http://localhost:8000 \
            grafana/k6 run - < loadtest/smoke.js

      - name: Clean up
        if: always()
        run: docker rm -f api redis || true

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
