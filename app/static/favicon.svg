<!--
  Procta favicon — the shield-crosshair mark from logo.svg, centered on a
  64×64 canvas with a navy rounded-square background so it renders cleanly
  at 16×16 in browser tabs and 48×48+ in Google SERPs.

  Used in two contexts:
    1. /favicon.svg          — modern browsers (Chrome, Firefox, Safari, Edge)
    2. Source for PNG renders at 16/32/48/180/192/512 (see scripts/gen_favicons.py)

  Design language matches app/static/logo.svg (shield + central eye + 4 ticks)
  so the brand mark is identical wherever it appears — browser tab, Google
  search snippet, iOS home-screen, Windows Start tile, OG image.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand-navy rounded-square background. Gives the mark enough contrast
       at 16px against light or dark browser chrome. -->
  <rect width="64" height="64" rx="12" fill="#0F1629"/>

  <!-- Outer shield (filled, soft blue tint) -->
  <path d="M19 11 L45 11 Q51 11 51 17 L51 32 Q51 49 32 56 Q13 49 13 32 L13 17 Q13 11 19 11 Z"
        fill="#5B8AF0" fill-opacity="0.18" stroke="#5B8AF0" stroke-width="1.8"/>

  <!-- Inner shield outline -->
  <path d="M22 17 L42 17 Q46 17 46 21 L46 32 Q46 45 32 51 Q18 45 18 32 L18 21 Q18 17 22 17 Z"
        fill="none" stroke="#5B8AF0" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Central "eye" -->
  <circle cx="32" cy="32" r="4.8" fill="#5B8AF0"/>

  <!-- 4 crosshair ticks -->
  <line x1="32" y1="22" x2="32" y2="26" stroke="#5B8AF0" stroke-width="1.4" stroke-opacity="0.7"/>
  <line x1="32" y1="38" x2="32" y2="42" stroke="#5B8AF0" stroke-width="1.4" stroke-opacity="0.7"/>
  <line x1="22" y1="32" x2="26" y2="32" stroke="#5B8AF0" stroke-width="1.4" stroke-opacity="0.7"/>
  <line x1="38" y1="32" x2="42" y2="32" stroke="#5B8AF0" stroke-width="1.4" stroke-opacity="0.7"/>
</svg>
